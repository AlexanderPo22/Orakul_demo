                function esc(s) {
                    return String(s)
                        .replace(/&/g, '&amp;')
                        .replace(/</g, '&lt;')
                        .replace(/>/g, '&gt;')
                        .replace(/"/g, '&quot;');
                }

                /* ---- сохранение состояния приложений ---- */
                /* Один ключ на всё: заказы, блокировку, интернет, поиск,
                   открытый чат и сами переписки. Переживает перезагрузку,
                   стирается на clear/reset. */
                function saveState() {
                    O.store.set(KEY.phone, {
                        ordered: { self: !!ordered.self, boss: !!ordered.boss },
                        bossBlocked: bossBlocked,
                        mobileData: mobileData,
                        searchOpen: !!browseResult,
                        browseQuery: browseQuery,
                        searchNote: searchNote,
                        downloadNote: downloadNote,
                        chat: chat,
                        chats: chats,
                        pizza: pizzaHere,
                        notesOpen: notesOpen,
                        bright: bright,
                        logoClicks: logoClicks,
                        orakul: orakulLoaded
                    });
                }

                function loadState() {
                    var s = O.store.get(KEY.phone, null);
                    if (!s || typeof s !== 'object' || Array.isArray(s)) return;

                    if (s.chats && typeof s.chats === 'object') {
                        ['boss', 'agent45', 'pizza', 'anon'].forEach(function (key) {
                            if (Array.isArray(s.chats[key])) {
                                chats[key] = s.chats[key].filter(function (m) {
                                    return m && typeof m.text === 'string' &&
                                           (m.who === 'me' || m.who === 'them' ||
                                            m.who === 'sys' || m.who === 'read');
                                });
                            }
                        });
                    }

                    // аноним уже писал — повторно не здороваемся
                    anonStarted = chats.anon.length > 0;

                    if (s.ordered && typeof s.ordered === 'object') {
                        ordered.self = !!s.ordered.self;
                        ordered.boss = !!s.ordered.boss;
                    }

                    bossBlocked = !!s.bossBlocked;
                    mobileData = !!s.mobileData;
                    searchNote = typeof s.searchNote === 'string' ? s.searchNote : '';
                    downloadNote = typeof s.downloadNote === 'string' ? s.downloadNote : '';
                    pizzaHere = !!s.pizza;
                    notesOpen = !!s.notesOpen;
                    orakulLoaded = !!s.orakul;

                    bright = (typeof s.bright === 'number' && s.bright >= 25 && s.bright <= 100)
                        ? s.bright : 100;
                    logoClicks = (typeof s.logoClicks === 'number') ? s.logoClicks : 0;

                    browseQuery = typeof s.browseQuery === 'string' ? s.browseQuery : '';
                    browseResult = (s.searchOpen && browseQuery) ? searchResult(browseQuery) : null;

                    chat = (s.chat === 'boss' || s.chat === 'agent45' ||
                            s.chat === 'pizza' || s.chat === 'anon')
                        ? s.chat : null;

                    // аноним уже в переписке — «Осмотреться» можно показывать
                    syncRoom();
                }

                function dropState() {
                    try { localStorage.removeItem(KEY.phone); } catch (e) {}
                }

                function clearTimers() {
                    timers.forEach(function (id) { clearTimeout(id); clearInterval(id); });
                    timers = [];
                }

                function later(fn, ms) {
                    var id = setTimeout(fn, ms);
                    timers.push(id);
                    return id;
                }

                function clock() {
                    if (!phoneClock) return;
                    var d = new Date();
                    phoneClock.textContent = ('0' + d.getHours()).slice(-2) + ':' +
                                             ('0' + d.getMinutes()).slice(-2);
                }

                function render(html, cls) {
                    phoneBody.className = 'phone-body' + (cls ? ' ' + cls : '');
                    phoneBody.innerHTML = html;
                }

                function shake() {
                    if (!phoneEl) return;
                    phoneEl.classList.remove('is-shaking');
                    void phoneEl.offsetWidth;
                    phoneEl.classList.add('is-shaking');
                    later(function () { phoneEl.classList.remove('is-shaking'); }, 440);
                }

                /* Две круглые кнопки вместо свайпов: отбой и ответ */
                function callActionsHTML() {
                    return '<div class="call-actions">' +
                               '<div class="call-action">' +
                                   '<button class="call-btn is-decline" type="button" data-call="decline" ' +
                                           'aria-label="Отклонить вызов">' +
                                       '<span aria-hidden="true">📞</span>' +
                                   '</button>' +
                                   '<span class="call-action-label">Отклонить</span>' +
                               '</div>' +
                               '<div class="call-action">' +
                                   '<button class="call-btn is-accept" type="button" data-call="accept" ' +
                                           'aria-label="Ответить на вызов">' +
                                       '<span aria-hidden="true">📞</span>' +
                                   '</button>' +
                                   '<span class="call-action-label">Ответить</span>' +
                               '</div>' +
                           '</div>';
                }

                function bindCallButtons() {
                    var dec = phoneBody.querySelector('[data-call="decline"]');
                    if (dec) {
                        dec.addEventListener('click', function (e) {
                            e.preventDefault();
                            drop('decline');
                        });
                    }

                    var acc = phoneBody.querySelector('[data-call="accept"]');
                    if (acc) {
                        acc.addEventListener('click', function (e) {
                            e.preventDefault();
                            accept();
                        });
                    }
                }

                function typeText(el, text, done) {
                    if (!el) return;
                    if (reduceMotion) { el.textContent = text; done(); return; }

                    var i = 0;
                    var timer = setInterval(function () {
                        i++;
                        el.textContent = text.slice(0, i);
                        if (i >= text.length) {
                            clearInterval(timer);
                            done();
                        }
                    }, 24);
                    timers.push(timer);
                }

                /* Звонок не приняли: кнопка «Отклонить» или 30 секунд тишины.
                   Босс не отстаёт — через 15 секунд телефон звонит снова. */
                function drop(reason) {
                    if (accepted || declined) return;
                    declined = true;
                    if (ringTimer) { clearTimeout(ringTimer); ringTimer = null; }
                    Snd.beep(200, 0.05, 0.26);
                    if (!O.has('ignore')) grant('ignore');
                    render(
                        '<div class="done-badge is-missed">' +
                            (reason === 'timeout' ? 'ПРОПУЩЕННЫЙ' : 'ПРОПУЩЕН') +
                        '</div>' +
                        '<p class="done-text">' +
                            (reason === 'timeout' ? 'Вы не ответили.' : 'Вы отклонили вызов.') +
                        '</p>' +
                        '<span class="done-sub">перезвонят</span>',
                        'is-done'
                    );

                    later(function () { ringing(); }, 15000);
                }

                function ringing() {
                    declined = false;
                    clock();
                    render(
                        '<div class="call-top">' +
                            '<span class="call-avatar">ЗВ</span>' +
                            '<span class="call-name">Злой Викторович</span>' +
                            '<span class="call-sub">входящий вызов</span>' +
                        '</div>' +
                        '<div class="call-bell" aria-hidden="true">🔔</div>' +
                        callActionsHTML(),
                        'is-ringing'
                    );
                    bindCallButtons();

                    ringTimer = later(function () { drop('timeout'); }, 30000);
                    Snd.echo(0.8);
                }

                function accept() {
                    if (accepted || declined) return;
                    accepted = true;
                    if (ringTimer) { clearTimeout(ringTimer); ringTimer = null; }

                    Snd.ring(1);   // звук звонка в момент принятия
                    shake();

                    render(
                        '<div class="call-top">' +
                            '<span class="call-avatar">ЗВ</span>' +
                            '<span class="call-name">Злой Викторович</span>' +
                            '<span class="call-sub is-live">на связи</span>' +
                        '</div>' +
                        '<p class="call-text" id="callText"></p>' +
                        '<div class="call-wave" aria-hidden="true">' +
                            '<i></i><i></i><i></i><i></i><i></i>' +
                        '</div>',
                        'is-live'
                    );

                    later(function () { Snd.beep(660, 0.03, 0.1); }, 260);

                    typeText(document.getElementById('callText'), PHONE_TEXT[kind], function () {
                        later(hangup, 2200);
                    });
                }

                function hangup() {
                    Snd.beep(180, 0.04, 0.26);

                    if (kind === 'help') {
                        // приложение «грузится», а потом само открывает
                        // список агентов — как будто его доставили на телефон
                        render(
                            '<div class="done-badge is-help">АГЕНТ 7031</div>' +
                            '<div class="app-tile">' +
                                '<span class="app-icon">🔮<span class="app-spin" aria-hidden="true"></span></span>' +
                                '<span class="app-name">orakul.app</span>' +
                                '<span class="app-state">загрузка…</span>' +
                            '</div>' +
                            '<span class="done-sub">звонок завершён</span>',
                            'is-done'
                        );

                        later(function () {
                            openApp('orakul');
                        }, 5200);

                        // если игрок сам не открыл карточку 45 — аноним
                        // всё равно выйдет на связь чуть позже
                        later(startAnon, 15000);
                    } else {
                        render(
                            '<div class="done-badge">УВОЛЕН</div>' +
                            '<p class="done-text">Вещи можно забрать в течение трёх дней.</p>' +
                            '<span class="done-sub">звонок завершён</span>',
                            'is-done'
                        );

                        // Телефон остаётся: рабочий стол и мысли вслух
                        later(function () {
                            goHome();
                        }, 2600);

                        later(function () {
                            think('надо узнать побольше про 45.', true);
                        }, 5600);

                        /* Аноним «???» выходит на связь и на ветке увольнения.
                           Раньше он писал только при выборе «Помощь 45»,
                           и после увольнения чат молчал. */
                        later(startAnon, 12000);
                    }
                }

                /* ================= РАБОЧИЙ СТОЛ И ПРИЛОЖЕНИЯ ================= */

                function tapPhone() {

                /* ---- браузер: строка поиска и результаты ---- */
                function searchResult(q) {
                    var n = String(q || '').toLowerCase();

                    if (/(^|\D)45(\D|$)/.test(n) || /5045/.test(n)) {
                        return { title: 'Агент 45', text: 'статус неизвестен', kind: 'agent' };
                    }
                    if (/оракул/.test(n)) {
                        return { title: 'Проект «Оракул»', text: 'закрытый проект. доступ ограничен.', kind: 'stub' };

                    if (/викторович|злой|босс/.test(n)) {
                        return { title: 'Злой Викторович', text: 'руководитель направления. статус: на связи.', kind: 'stub' };
                    }
                    return { title: 'Ничего не найдено', text: 'попробуйте другой запрос.', kind: 'empty' };
                }

                    browseQuery = String(q || '').trim();

                    browseResult = searchResult(browseQuery);
                    searchNote = browseResult.kind === 'agent' ? '' : 'уведомление придёт позже';

                /* ---- orakul.app: список агентов ---- */

                    { num: '5045', role: 'статус неизвестен', off: true },
                    { num: '6006', role: 'на связи' },
                    { num: '7031', role: 'вы', me: true },
                    { num: '7042', role: 'на связи' },
                    { num: '8013', role: 'на связи' },
                    { num: '8099', role: 'на связи' },
                    { num: '9054', role: 'руководитель', boss: true }
                ];

                function agentDetailHTML(num) {
                    var a = null;
                    AGENTS.forEach(function (x) { if (x.num === num) a = x; });
                    if (!a) a = { num: num, role: 'на связи' };

                    var title = a.off ? 'Агент 45' : 'Агент ' + a.num;

                        note = 'последний выход на связь: 3 дня назад. стол 45 пустой.';
                    } else if (a.boss) {
                        note = 'руководитель направления. злой викторович.';
                    } else if (a.me) {
                        note = 'это ваш номер. доступ: ' + (admin ? 'admin' : 'guest') + '.';
                    } else {
                        note = 'задач нет. линия свободна.';
                    }

                    return '<div class="ag-card">' +
                               '<span class="ag-title">' + title + '</span>' +
                               '<span class="ag-status">' + status + '</span>' +
                               '<span class="ag-note">' + note + '</span>' +
                           '</div>' +
                           '<button class="ag-back" type="button" data-act="agents">‹ к списку</button>';
                }

                function orakulBody() {
                    if (!orakulLoaded) return orakulLoadingHTML();
                    if (orakulAgent) return agentDetailHTML(orakulAgent);
                    return agentListHTML();
                }

                /* Аноним «???»: чат есть в мессенджере всегда, здесь только
                   добавляем в него переписку — сам чат не создаём. */
                function startAnon() {
                    if (anonStarted) return;
                    anonStarted = true;

                    later(function () {
                        // если игрок уже успел написать — вступление не дублируем
                        if (!chats.anon.length) {
                            chats.anon.push({ who: 'me', text: 'Кто ты?' });
                            chats.anon.push({ who: 'me', text: 'Помоги найти 45.' });
                        }
                        if (view !== 'call') paint();
                        phoneNotify('???', 'Кто ты?', '❔');
                        grant('anon');
                        think('кто-то пишет в мессенджер...');
                        Snd.mystery();
                        syncRoom();   // теперь можно осмотреться
                    }, 2200);

                    later(function () {
                        chats.anon.push({
                            who: 'them',
                            text: 'Я покупатель. Информация, которую продавал твой босс, мне не нужна. ' +
                                  'Я ищу 45. Помоги — и я помогу тебе.'
                        });
                        if (view !== 'call') paint();
                        phoneNotify('???', 'Помоги — и я помогу тебе.', '❔');
                    }, 7000);
                }

                /* Ответы анонима: короткие, по делу */
                function sendAnon(norm) {
                    var reply = 'Не отвлекайся. Ищи 45.';

                    if (/договор|соглас|давай|хорошо/.test(norm)) {
                        reply = 'Хорошо. Начни с автомата со снеками. За ним есть то, что тебе поможет.';
                    } else if (/начнем|с чего|план|что делать|подскаж/.test(norm)) {
                        reply = 'Осмотрись в комнате: кулер, автомат. За автоматом — щель.';
                    } else if (/(^|\D)45(\D|$)/.test(norm) || /найти|искать|где/.test(norm)) {
                        reply = '45 был здесь. Его стол пустой третий день. Ищи в комнате.';
                    } else if (/кто ты|кто вы|ты кто/.test(norm)) {
                        reply = 'Покупатель. Тот, кому босс продавал информацию. Теперь я ищу 45.';
                    }

                    chatBusy = true;
                    chatTyping = true;

                    later(function () {
                        chatTyping = false;
                        chatBusy = false;
                        chats.anon.push({ who: 'them', text: reply });
                        paint();
                    }, 1700);
                }

                function preview(key) {
                    if (key === 'boss' && bossBlocked) return 'вы заблокированы';
                    var list = chats[key];
                    if (!list || !list.length) return 'сообщений нет';
                    var last = list[list.length - 1];
                    return (last.who === 'me' ? 'вы: ' : '') + last.text;
                }

                function chatRow(key, ava, name) {
                    return '<button class="chat-row" type="button" data-act="chat" data-chat="' + key + '">' +
                               '<span class="chat-ava" aria-hidden="true">' + ava + '</span>' +
                               '<span class="chat-meta">' +
                                   '<span class="chat-name">' + name + '</span>' +
                                   '<span class="chat-last">' + esc(preview(key)) + '</span>' +
                               '</span>' +
                           '</button>';
                }

                function messengerBody() {
                    if (!mobileData) return netOff();

                    // «???» есть в списке всегда — переписка появляется позже
                    return chatRow('anon', '❔', '???') +
                           chatRow('boss', 'ЗВ', 'Злой Викторович') +
                           chatRow('agent45', '45', '5045') +
                           chatRow('pizza', '🍕', 'Доставка пиццы');
                }

                /* Быстрые ответы: готовый текст, но можно писать и своё */
                var QUICK = {
                    boss: ['Пока, Злой Витя', 'Как дела?', 'Я уволен?'],
                    agent45: ['Привет, я хочу узнать про вашу компанию'],
                    anon: ['Договорились', 'С чего начнем?'],
                    pizza: ['Заказать пиццу на мой адрес', 'Заказать пиццу на адрес босса']
                };

                function chatHTML() {
                    var list = chats[chat] || [];
                    var html = '<div class="chat-head">' +
                                   '<button class="chat-back" type="button" data-act="chats" ' +
                                           'aria-label="Назад к чатам">‹</button>' +
                                   '<span>' + CHAT_NAMES[chat] + '</span>' +
                               '</div>' +
                               '<div class="chat-log">';

                    list.forEach(function (m) {
                        html += '<div class="msg is-' + m.who + '">' + esc(m.text) + '</div>';
                    });
                    if (chatTyping) html += '<div class="chat-typing">печатает…</div>';
                    html += '</div>';

                    var blocked = chat === 'boss' && bossBlocked;

                    // Быстрые ответы над строкой ввода
                    if (chat === 'pizza') {
                        var chips = '';
                        if (!ordered.self) {
                            chips += '<button class="chat-chip" type="button" data-act="order" data-var="self">' +
                                         'Заказать пиццу на мой адрес</button>';
                        }
                        if (!ordered.boss) {
                            chips += '<button class="chat-chip" type="button" data-act="order" data-var="boss">' +
                                         'Заказать пиццу на адрес босса</button>';
                        }
                        if (chips) html += '<div class="chat-quick">' + chips + '</div>';
                    } else if (!blocked) {
                        var q = QUICK[chat] || [];
                        if (q.length) {
                            html += '<div class="chat-quick">';
                            q.forEach(function (t) {
                                html += '<button class="chat-chip" type="button" data-act="quick" ' +
                                            'data-text="' + esc(t) + '">' + esc(t) + '</button>';
                            });
                            html += '</div>';
                        }
                    }

                    if (blocked) {
                        html += '<div class="chat-blocked">вы заблокированы</div>';
                        return html;
                    }

                    html += '<div class="chat-form">' +
                                '<input class="chat-input" type="text" autocomplete="off" ' +
                                       'spellcheck="false" placeholder="сообщение" aria-label="Сообщение">' +
                                '<button class="chat-send" type="button" data-act="send" ' +
                                        'aria-label="Отправить">→</button>' +
                            '</div>';
                    return html;
                }

                function storeBody() {
                    var html = (downloadNote ? '<p class="app-note">' + downloadNote + '</p>' : '');

                    // EasyHacking нашли за автоматом — его можно поставить
                    if (room.slot && !room.hacked) {
                        html += '<button class="store-app" type="button" data-act="hack">' +
                                    '<span class="home-ico" aria-hidden="true">🕹️</span>' +
                                    '<span>EasyHacking<br>' +
                                        '<span class="store-sub">найдено за автоматом</span>' +
                                    '</span>' +
                                '</button>';
                    } else if (room.hacked) {
                        html += '<button class="store-app" type="button" data-act="hack">' +
                                    '<span class="home-ico" aria-hidden="true">🕹️</span>' +
                                    '<span>EasyHacking<br>' +
                                        '<span class="store-sub">установлено</span>' +
                                    '</span>' +
                                '</button>';
                    }

                    html += orakulLoaded
                        ? '<button class="store-app" type="button" data-act="open" data-app="orakul">' +
                              '<span class="home-ico" aria-hidden="true">🔮</span>' +
                              '<span>orakul.app<br><span class="store-sub">установлено</span></span>' +
                          '</button>'
                        : '<button class="store-app" type="button" data-act="download">' +
                              '<span class="home-ico" aria-hidden="true">🔮</span>' +
                              '<span>orakul.app<br>' +
                                  '<span class="store-sub">недоступно в вашем регионе</span>' +
                              '</span>' +
                          '</button>';

                    return html + '<p class="set-hint">остальные приложения появятся позже.</p>';
                }

                function scrollLog() {
                    var log = phoneBody.querySelector('.chat-log');
                    if (log) log.scrollTop = log.scrollHeight;
                }

                /* Перерисовка текущего экрана. Во время звонка не трогаем
                   body: там живёт экран вызова со своими таймерами. */
                function paint() {
                    if (view === 'call') return;
                    clock();

                    var active = document.activeElement;
                    var typingIn = !!(active && active.classList &&
                                      (active.classList.contains('chat-input') ||
                                       active.classList.contains('browse-field')));
                    var kept = typingIn ? active.value : '';

                    if (view === 'home') render(homeHTML(), 'is-home');
                    else if (chat) render(chatHTML(), 'is-chat');
                    else if (app === 'settings') render(appShell('Настройки', settingsBody()), 'is-app');
                    else if (app === 'browser') render(appShell('Браузер', browserBody()), 'is-app');
                    else if (app === 'messenger') render(appShell('Мессенджер', messengerBody()), 'is-app');
                    else if (app === 'orakul') render(appShell('orakul.app', orakulBody()), 'is-app');
                    else if (app === 'store') render(appShell('Скачать приложения', storeBody()), 'is-app');
                    else render(homeHTML(), 'is-home');

                    if (typingIn) {
                        var inp = phoneBody.querySelector('.chat-input, .browse-field');
                        if (inp) { inp.value = kept; inp.focus(); }
                    }

                    applyBright();
                    setFan(view === 'app');
                    scrollLog();
                    saveState();
                }

                /* Яркость экрана из настроек */
                function applyBright() {
                    var screenEl = document.querySelector('.phone-screen');
                    if (screenEl) screenEl.style.filter = 'brightness(' + (bright / 100) + ')';
                }

                /* Офисный гул: только когда телефон включён, не во время звонка */
                var fanOn = false;

                function setFan(on) {
                    if (fanOn === on) return;
                    fanOn = on;
                    Snd.fan(on);
                }

                function goHome() {
                    view = 'home';
                    app = null;
                    chat = null;
                    paint();
                }

                function openApp(name) {
                    view = 'app';
                    app = name;
                    chat = null;
                    searchNote = '';

                    if (name === 'settings') think('где тут мобильные данные?');
                    if (name === 'browser' && mobileData) think('интернет есть, отлично.');
                    if (name === 'messenger') think('посмотрим, что тут пишут.');
                    if (name === 'orakul') think('так, кто ещё на связи?');

                    // orakul.app первый раз «догружается» — как в звонке
                    if (name === 'orakul') {
                        orakulAgent = null;
                        if (!orakulLoaded) {
                            later(function () {
                                orakulLoaded = true;
                                Snd.beep(560, 0.02, 0.08);
                                paint();
                            }, 1500);
                        }
                    }

                    // «Скачать приложения»: заглушка сразу даёт «ту дум»
                    if (name === 'store') {
                        tapPhone();
                        downloadNote = 'уведомление придёт позже';
                    }

                    paint();
                    Snd.beep(620, 0.02, 0.07);
                }

                function sendFromInput() {
                    var inp = phoneBody.querySelector('.chat-input');
                    if (!inp) return;
                    var text = inp.value;
                    inp.value = '';
                    sendChat(text);
                }

                function sendChat(raw) {
                    var text = String(raw || '').trim();
                    if (!text || chatBusy || !chat) return;

                    var norm = text.toLowerCase()
                        .replace(/[«»"'`]/g, '')
                        .replace(/[?!.,:;]/g, ' ')
                        .replace(/\s+/g, ' ')
                        .trim();

                    chats[chat].push({ who: 'me', text: text });
                    Snd.beep(720, 0.02, 0.06);

                    if (chat === 'boss') sendBoss(norm);
                    else if (chat === 'agent45') sendAgent();
                    else if (chat === 'pizza') sendPizza(norm);
                    else if (chat === 'anon') sendAnon(norm);
                    paint();
                }

                /* Босс: «Пока, Злой Витя» → печатает → срок → блокировка.
                   На остальные сообщения отвечает по-человечески. */
                function sendBoss(norm) {
                    var bye = /(^|\s)пока(\s|$)/.test(norm) ||
                              /витя/.test(norm) ||
                              /до свидан/.test(norm);
                    var how = /как дела|как ты|как жизн|как настроен/.test(norm);
                    var firedQ = /уволен|уволил|уволят|увольнен/.test(norm);
                    var secretQ = /что ты сделал|я знаю что/.test(norm);

                    chatBusy = true;
                    chatTyping = true;

                    // Секретная реплика: босс надолго замолкает
                    if (secretQ && !bye) {
                        later(function () {
                            chatTyping = false;
                            chats.boss.push({ who: 'them', text: '...ты о чем?' });
                            paint();
                            chatBusy = false;
                        }, 2600);
                        return;
                    }

                    if (!bye) {
                        var reply = 'я занят. пиши по делу.';
                        if (how) reply = 'Работаю. В отличие от некоторых.';
                        else if (firedQ) reply = 'Пока нет. Но ты очень стараешься.';

                        later(function () {
                            chatTyping = false;
                            chats.boss.push({ who: 'them', text: reply });
                            paint();
                            chatBusy = false;
                        }, 1500);
                        return;
                    }

                    later(function () {
                        chatTyping = false;
                        chats.boss.push({ who: 'them', text: 'теперь у тебя 1 день.' });
                        paint();
                    }, 1600);

                    later(function () {
                        bossBlocked = true;
                        chats.boss.push({ who: 'sys', text: 'пользователь заблокировал вас' });
                        paint();
                        grant('rebel');
                        think('ну и ладно, я не гордый.', true);
                        chatBusy = false;
                    }, 3400);
                }

                /* 45: сообщение прочитано, ответа нет */
                function sendAgent() {
                    grant('insider');
                    /* Первое сообщение 5045 за сеанс — «Свой человек» и +10% */
                    if (!sanityRestored.agent45) {
                        sanityRestored.agent45 = true;
                        restoreSanity(10, '5045');
                    }

                    later(function () {
                        chats.agent45.push({ who: 'read', text: '✓✓ прочитано' });
                        paint();
                    }, 1100);
                }

                /* Заказ пиццы: кнопка подставляет готовый текст, свободный
                   ввод разбирается по словам (босс/мой адрес). */
                function orderPizza(variant) {
                    if (chatBusy || !PIZZA_ORDER[variant] || ordered[variant]) return;
                    chats.pizza.push({ who: 'me', text: PIZZA_ORDER[variant] });
                    startOrder(variant);
                }

                function sendPizza(norm) {
                    var isOrder = /пицц|заказ|пеперони|адрес/.test(norm);
                    var variant = /босс|викторович|импери/.test(norm) ? 'boss' : 'self';

                    if (isOrder && !ordered[variant]) {
                        startOrder(variant);
                        return;
                    }

                    chatBusy = true;
                    chatTyping = true;

                    later(function () {
                        chatTyping = false;
                        chatBusy = false;
                        chats.pizza.push({
                            who: 'them',
                            text: isOrder ? 'такой заказ уже принят. ждите курьера.'
                                          : 'здравствуйте! что будете заказывать?'
                        });
                        paint();
                    }, 1300);
                }

                function startOrder(variant) {
                    ordered[variant] = true;
                    Snd.beep(720, 0.02, 0.06);
                    think(variant === 'self'
                        ? 'надеюсь, пицца доедет...'
                        : 'посмотрим, как он отреагирует.');
                    chatBusy = true;
                    chatTyping = true;
                    paint();

                    later(function () {
                        chatTyping = false;
                        chats.pizza.push({ who: 'them', text: 'здравствуйте! в течение 45 минут приедет.' });
                        paint();
                        chatBusy = false;
                    }, 1500);

                    if (variant === 'self') {
                        later(deliverPizza, 45000);
                    } else {
                        grant('gourmet');
                        later(bossReaction, 50000);
                    }
                }

                /* Пицца на свой адрес: приезжает и висит под телефоном
                   до сброса. Карточка живёт вне экрана — в колонке телефона. */
                function deliverPizza() {
                    pizzaHere = true;
                    grant('turtle');
                    /* Пицца на свой адрес за сеанс — «Как у черепах» и +20% */
                    if (!sanityRestored.pizza) {
                        sanityRestored.pizza = true;
                        restoreSanity(20, 'пицца');
                    }
                    Snd.doorbell();
                    phoneNotify('Доставка пиццы', 'Курьер привез заказ', '🍕');
                    renderPizzaCard();
                    think('о, пицца! Спасибо, курьер!', true);
                    saveState();
                }

                function renderPizzaCard() {
                    if (!phoneUnder || !pizzaHere) return;
                    if (phoneUnder.querySelector('.phone-pizza')) return;

                    var el = document.createElement('div');
                    el.className = 'phone-pizza';
                    el.innerHTML = '<div class="pizza-disc" aria-hidden="true">🍕</div>' +
                                   '<p class="pizza-caption">Пицца приехала. ул. Петли, 7</p>';
                    phoneUnder.appendChild(el);
                }

                /* Пицца на адрес босса: босс выходит на связь */
                function bossReaction() {
                    if (bossBlocked) {
                        bossBlocked = false;
                        chats.boss.push({ who: 'them', text: 'разблокировал. твои вещи мы тебе не вернём.' });
                        phoneNotify('Злой Викторович', 'разблокировал тебя. твои вещи мы тебе не вернём.');
                        paint();

                        later(function () {
                            bossBlocked = true;
                            chats.boss.push({ who: 'sys', text: 'пользователь заблокировал вас' });
                            paint();
                        }, 3200);
                        return;
                    }

                    chats.boss.push({ who: 'them', text: 'твоих рук дело? теперь у тебя 1 день.' });
                    phoneNotify('Злой Викторович', 'твоих рук дело? теперь у тебя 1 день.');
                    paint();
                }

                function phoneNotify(title, text, ico) {
                    if (!phoneLayer) return;

                    var el = document.createElement('div');
                    el.className = 'phone-notify';
                    el.innerHTML = '<span class="pn-ico" aria-hidden="true">' + (ico || '💬') + '</span>' +
                                   '<span class="pn-body">' +
                                       '<span class="pn-app">' + esc(title) + '</span>' +
                                       '<span class="pn-text">' + esc(text) + '</span>' +
                                   '</span>';
                    phoneLayer.appendChild(el);

                    later(function () { el.classList.add('is-in'); }, 20);
                    later(function () {
                        el.classList.remove('is-in');
                        later(function () { el.remove(); }, 500);
                    }, 5000);
                }

                function onBodyClick(e) {
                    var el = e.target.closest && e.target.closest('[data-act]');
                    if (!el) return;

                    var act = el.getAttribute('data-act');

                    if (act === 'home') { Snd.beep(300, 0.02, 0.06); goHome(); return; }
                    if (act === 'open') { openApp(el.getAttribute('data-app')); return; }

                    if (act === 'data') {
                        mobileData = !mobileData;
                        Snd.beep(mobileData ? 760 : 320, 0.03, 0.08);
                        paint();
                        return;
                    }

                    if (act === 'wifi') {
                        tapPhone();
                        wifiMsg = 'нет пароля';
                        paint();
                        return;
                    }

                    if (act === 'search') {
                        var field = phoneBody.querySelector('.browse-field');
                        Snd.beep(520, 0.02, 0.06);
                        runSearch(field ? field.value : '');
                        return;
                    }

                    if (act === 'query') {
                        tapPhone();
                        runSearch(el.getAttribute('data-q'));
                        return;
                    }

                    if (act === 'notes-close') {
                        notesOpen = false;
                        paint();
                        return;
                    }

                    /* Логотип в настройках: пять касаний — секрет */
                    if (act === 'logo') {
                        logoClicks++;
                        Snd.key();
                        if (logoClicks >= 5) {
                            grant('secret');
                            phoneNotify('Настройки', 'Ты нашел секрет', '🍎');
                        }
                        paint();
                        return;
                    }

                    if (act === 'download') {
                        tapPhone();
                        downloadNote = 'уведомление придёт позже';
                        paint();
                        return;
                    }

                    if (act === 'agent') {
                        orakulAgent = el.getAttribute('data-num');
                        Snd.beep(520, 0.02, 0.06);
                        // заглянул в карточку 45 — аноним выходит на связь
                        if (orakulAgent === '5045') startAnon();
                        paint();
                        return;
                    }

                    if (act === 'agents') { orakulAgent = null; paint(); return; }
                    if (act === 'hack') { openHack(); return; }

                    if (act === 'chats') { chat = null; paint(); return; }
                    if (act === 'chat') { chat = el.getAttribute('data-chat'); paint(); return; }
                    if (act === 'quick') { sendChat(el.getAttribute('data-text')); return; }
                    if (act === 'order') { orderPizza(el.getAttribute('data-var')); return; }
                    if (act === 'send') { sendFromInput(); return; }
                }

                phoneBody.addEventListener('click', onBodyClick);

                /* Ползунок «Яркость»: живое затемнение экрана */
                phoneBody.addEventListener('input', function (e) {
                    if (!e.target.classList || !e.target.classList.contains('set-range')) return;
                    bright = parseInt(e.target.value, 10) || 100;
                    applyBright();
                    saveState();
                });

                phoneBody.addEventListener('keydown', function (e) {
                    if (e.ctrlKey || e.metaKey || e.altKey) return;

                    // механическая клавиатура: и в чате, и в поиске
                    if (e.key.length === 1) Snd.key();

                    if (e.key !== 'Enter') return;

                    if (e.target.classList && e.target.classList.contains('chat-input')) {
                        e.preventDefault();
                        sendFromInput();
                        return;
                    }

                    if (e.target.classList && e.target.classList.contains('browse-field')) {
                        e.preventDefault();
                        runSearch(e.target.value);
                    }
                });

                /* Свайп вправо на рабочем столе — панель «заметки 45» */

                    if (swipeX === null) return;

                    swipeX = null;

                    if (dx > 50 && !notesOpen) {
                        notesOpen = true;

            var exitFailedOnce = false;

            /* ================= CONNECT ================= */
            /* Номера: первые две цифры — должность, последние две — агент.
                 3017 — агент 17 на должности 30 (Неизвестный)
                 9054 — агент 54 на должности 90 (босс, только admin)
                 7031 — твой номер под admin
                 5045 — агент 45, за чьим столом мы сидим */
            function handleConnect(args) {
                var raw = args.join(' ').trim();
                var target = normalize(raw);
                var digits = target.replace(/\s+/g, '');

                if (!target) {
                    line('> Укажи номер агента.', 'line-dialog');
                    line('формат: connect <номер>, например connect 3017', 'line-dim');
                    return;
                }

                if (digits === '3017' || /неизвестн/.test(target)) { startUnknown(); return; }
                if (digits === '9054' || /босс|злой|викторович/.test(target)) { startBoss(); return; }
                if (digits === '7031') { callSelf(); return; }

                line('[ERROR] Неизвестный адресат: ' + raw, 'line-err');
                line('адресаты: 3017 · 9054 · 7031', 'line-dim');
            }

            /* connect 7031 — это свой же номер.
               Гость ещё не знает, что 7031 — его номер, поэтому просто
               слышит автоответчик. Ачивка — только под admin, когда
               он осознанно набирает себя. */
            function callSelf() {
                if (admin) {
                    line('> Вы не можете позвонить себе.', 'line-dialog');
                    Snd.beep(300, 0.03, 0.12);

                    // «Сам себе не дозвонишься»
                    var myGen = gen;
                    setTimeout(function () {
                        if (myGen === gen) grant('selfcall');
                    }, 900);
                    return;
                }
                line('> Абонент недоступен. Оставьте сообщение после сигнала.', 'line-dialog');
                Snd.beep(420, 0.03, 0.1);
                setTimeout(function () { Snd.beep(260, 0.03, 0.16); }, 170);
            }

            /* ================= ВВОД ================= */
            var historyList = [];
            var histPos = -1;

            function run(raw) {
                var cmd = String(raw || '').trim();
                if (!cmd) return;

                echo(cmd);
                historyList.push(cmd);
                histPos = historyList.length;

                // Первая команда за сеанс — герой думает вслух
                think('так, попробую connect...', true);

                // Пока идёт анимация соединения — ввод ждёт
                if (connecting) {
                    line('> соединение устанавливается, подожди…', 'line-dim');
                    return;
                }

                var lower = cmd.toLowerCase();
                var parts = lower.split(/\s+/);
                var name = parts[0];

                // Служебные команды работают всегда
                if (name === 'clear' || name === 'reset') { COMMANDS[name](); return; }
                if (name === 'exit') { COMMANDS.exit(); return; }
                if (name === 'login') { doLogin(cmd); return; }
                if (name === 'logout' || name === 'unlogin') { doLogout(); return; }

                // Диалог ждёт ответа — строка трактуется как ответ
                if (boss.state === 'waiting') { bossAnswer(cmd); return; }
                if (unknown.state === 'waiting') { unknownAnswer(cmd); return; }

                // Секретные ключи
                if (lower === 'oracle' || lower === 'v3.7.0') { grantHacker(); return; }
                if (lower === 'onepiece' || lower === 'luffy') { grantOnePiece(); return; }
                if (lower === 'remember' || lower === '45') { rememberCmd(); return; }

                if (name === 'connect') { handleConnect(cmd.split(/\s+/).slice(1)); return; }

                if (Object.prototype.hasOwnProperty.call(COMMANDS, name)) {
                    COMMANDS[name]();
                    return;
                }

                line('command not found: ' + cmd, 'line-err');
                line('попробуй help', 'line-dim');
            }

            /* ================= РАССУДОК ================= */
            var sanityEl = document.getElementById('sanity');
            var sanityFill = document.getElementById('sanityFill');
            var sanityNum = document.getElementById('sanityNum');
            var sanityEmoji = document.getElementById('sanityEmoji');
            var sanityVeil = document.getElementById('sanityVeil');

            /* Сколько рассудка утекает за минуту, пока игрок смотрит в консоль.
               Ивенты кусают сверху: у каждого своя цена. */
            var SANITY_DRAIN_PER_MIN = 2.6;
            var SANITY_AFTER_BREAK = 50;

            var sanity = (function () {
                var v = O.store.get('console.sanity', 100);
                if (typeof v !== 'number' || !isFinite(v)) v = 100;
                return Math.max(0, Math.min(100, v));
            })();

            var sanityBroken = false;

            /* Восстановление за сюжетные действия — раз за сеанс, чтобы
               clear/reset нельзя было превратить в ферму рассудка. */
            var sanityRestored = { agent45: false, pizza: false };

            function saveSanity() {
                O.store.set('console.sanity', Math.round(sanity * 10) / 10);
            }

            function sanityMood(v) {
                if (v >= 80) return '🧘‍♂️';
                if (v >= 55) return '😰';
                if (v >= 30) return '😨';
                if (v >= 10) return '🤪';
                return '💀';
            }

            function renderSanity() {
                var v = Math.round(sanity);

                if (sanityFill) sanityFill.style.height = v + '%';
                if (sanityNum) sanityNum.textContent = v + '%';
                if (sanityEmoji) sanityEmoji.textContent = sanityMood(v);

                if (sanityEl) {
                    sanityEl.classList.toggle('is-low', v < 35);
                    sanityEl.classList.toggle('is-critical', v <= 10);
                    sanityEl.classList.toggle('is-broken', sanityBroken);
                    sanityEl.setAttribute('aria-label', 'Рассудок ' + v + '%');
                }

                /* Красная пелена по краям: 0% — почти глухая */
                if (sanityVeil) {
                    var edge = Math.max(0, Math.min(1, (60 - v) / 60));
                    sanityVeil.style.opacity = (edge * 0.85).toFixed(3);
                }
            }

            /* Всплывающее «+20%» у шкалы */
            function sanityPop(text, down) {
                var el = document.createElement('div');
                el.className = 'sanity-pop' + (down ? ' is-down' : '');
                el.textContent = text;
                document.body.appendChild(el);
                setTimeout(function () { el.remove(); }, 1700);
            }

            function changeSanity(delta, quiet) {
                if (!delta) return;

                var before = sanity;
                sanity = Math.max(0, Math.min(100, sanity + delta));
                if (Math.abs(sanity - before) < 1e-6) return;

                saveSanity();
                renderSanity();

                if (!quiet) {
                    var diff = Math.round(sanity - before);
                    if (diff > 0) sanityPop('+' + diff + '%');
                    else if (diff < 0 && diff >= -3) sanityPop(diff + '%', true);
                }

                if (sanity <= 0 && before > 0) sanityBreak();
            }

            /* Восстановление рассудка: пицца, 5045, выход, отдых */
            function restoreSanity(amount, reason) {
                if (sanityBroken) return;
                var before = Math.round(sanity);
                changeSanity(amount, true);
                var gained = Math.round(sanity) - before;
                if (gained > 0) sanityPop('+' + gained + '% · ' + reason);
            }

            /* Обнуление сюжета: рассудок на нуле */
            function sanityBreak() {
                if (sanityBroken) return;
                sanityBroken = true;
                eventBusy = true;
                lastHorrorAt = Date.now();

                sanity = 0;
                saveSanity();
                renderSanity();

                if (Snd.sanityBreak) Snd.sanityBreak();
                document.body.classList.add('is-sanity-broken', 'is-flash-red');
                if (O.cursor) O.cursor.freeze(1400);

                var realTitle = document.title;
                document.title = 'РАЗУМ РАЗРУШЕН';
                setTimeout(function () { document.title = realTitle; }, 3400);

                var fx = document.createElement('div');
                fx.className = 'fx-sanity-break';
                fx.innerHTML = '<div class="fx-sanity-cracks"></div>' +
                               '<div class="fx-sanity-text">РАЗУМ РАЗРУШЕН</div>' +
                               '<div class="fx-sanity-sub">[СИСТЕМА] Разум разрушен. Сюжет обнулён.</div>';
                document.body.appendChild(fx);

                /* Сюжет — в ноль. Награды, мана и доступ остаются. */
                resetPlotOnly();

                line('[СИСТЕМА] Разум разрушен. Сюжет обнулён.', 'line-err', { instant: true });
                line('сюжетные ключи стёрты. награды и мана на месте.', 'line-dim', { instant: true });
                line('где-то в глубине консоли осталась команда. она помнит.', 'line-dim', { instant: true });

                setTimeout(function () {
                    fx.classList.add('is-out');
                    document.body.classList.remove('is-sanity-broken');
                    setTimeout(function () {
                        fx.remove();
                        document.body.classList.remove('is-flash-red');
                    }, 600);
                }, 2600);

                setTimeout(function () {
                    sanity = SANITY_AFTER_BREAK;
                    sanityBroken = false;
                    eventBusy = false;
                    saveSanity();
                    renderSanity();
                    sanityPop('+' + SANITY_AFTER_BREAK + '% · восстановление');
                    line('рассудок восстановлен до ' + SANITY_AFTER_BREAK + '%.', 'line-ok', { instant: true });
                }, 3400);
            }

            renderSanity();

            /* Пассивная утечка рассудка: пока смотрим в консоль, он тает.
               Считаем по реальному времени, чтобы фоновые throttling-и
               не растягивали минуту в полчаса. */
            var sanityDrainAt = Date.now();

            setInterval(function () {
                if (document.hidden || sanityBroken) { sanityDrainAt = Date.now(); return; }
                var now = Date.now();
                var dt = (now - sanityDrainAt) / 60000;
                sanityDrainAt = now;
                if (dt <= 0) return;
                changeSanity(-SANITY_DRAIN_PER_MIN * Math.min(dt, 0.5), true);
            }, 5000);

            /* Перезагрузка страницы = полное восстановление рассудка.
               Обычный переход из консоли даёт +5–10% (см. pagehide ниже). */
            (function detectReload() {
                var reload = false;
                try {
                    var nav = performance.getEntriesByType && performance.getEntriesByType('navigation')[0];
                    if (nav && nav.type) reload = nav.type === 'reload';
                    else if (performance.navigation) reload = performance.navigation.type === 1;
                } catch (e) {}

                if (reload) sanity = 100;
                else if (sanity <= 0) sanity = SANITY_AFTER_BREAK;   // вышли во время сбоя

                saveSanity();
                renderSanity();
            })();

            /* Выход из консоли: +5–10% (переход на главную, закрытие вкладки) */
            var sanityLeaveBonus = false;

            function grantLeaveBonus() {
                if (sanityLeaveBonus || sanityBroken) return;
                sanityLeaveBonus = true;
                sanity = Math.max(0, Math.min(100, sanity + 5 + Math.random() * 5));
                saveSanity();
            }

            window.addEventListener('pagehide', grantLeaveBonus);
            window.addEventListener('beforeunload', grantLeaveBonus);

            /* Вкладка свернута на 5 минут — рассудок отдыхает до 100% */
            var sanityHiddenAt = 0;

            function restoreFromIdle() {
                if (!sanityHiddenAt) return;
                var away = Date.now() - sanityHiddenAt;
                sanityHiddenAt = 0;
                if (away >= 5 * 60 * 1000 && !sanityBroken) {
                    sanity = 100;
                    saveSanity();
                    renderSanity();
                    sanityPop('+100% · отдых');
                }
            }

            document.addEventListener('visibilitychange', function () {
                if (document.hidden) { sanityHiddenAt = Date.now(); return; }
                restoreFromIdle();
            });

            /* Подстраховка: таймеры в фоне душат, но раз в 30 секунд
               проверить, что вкладка спит уже достаточно, — дёшево. */
            setInterval(function () {
                if (!document.hidden || !sanityHiddenAt || sanityBroken) return;
                if (Date.now() - sanityHiddenAt >= 5 * 60 * 1000) {
                    sanity = 100;
                    saveSanity();
                }
            }, 30000);

            /* ================= ХОРРОР-ИВЕНТЫ ================= */
            /* 11 штук. Шанс зависит от рассудка: 1% при 100, 10% при 50,
               50% при 10. У каждого есть секретная команда для вызова. */
            var fxLayerEl = document.getElementById('fxLayer');
            var eventBusy = false;
            var lastHorrorAt = 0;

            function fxClear() {
                if (fxLayerEl) fxLayerEl.innerHTML = '';
            }

            function fxEl(cls, html) {
                var el = document.createElement('div');
                el.className = cls;
                if (html) el.innerHTML = html;
                if (fxLayerEl) fxLayerEl.appendChild(el);
                return el;
            }

            /* Шанс ивента на одну проверку. Кривая проходит через
               заданные точки: 100% → 1%, 50% → 10%, 10% → 50%, 0% → 100%. */
            function horrorChance() {
                var s = Math.max(0, Math.min(100, sanity));
                if (s <= 0) return 1;
                if (s <= 10) return 1 - (s / 10) * 0.5;
                if (s <= 50) return 0.5 - ((s - 10) / 40) * 0.4;
                return 0.1 - ((s - 50) / 50) * 0.09;
            }

            var EVENTS = {
                /* 1. Выключение энергии */
                power: { cost: 6, dur: 3000, run: function () {
                    var veil = fxEl('fx-blackout');
                    document.body.classList.add('is-blackout');
                    if (Snd.rumble) Snd.rumble();
                    if (Snd.staticNoise) Snd.staticNoise();

                    var orb = document.getElementById('cursorOrb');
                    if (orb) orb.classList.add('is-glow');

                    /* искры от умирающего света */
                    var sparks = fxEl('fx-sparks');
                    for (var i = 0; i < 10; i++) {
                        var sp = document.createElement('span');
                        sp.className = 'fx-spark';
                        sp.style.left = (20 + Math.random() * 60) + '%';
                        sp.style.top = (20 + Math.random() * 60) + '%';
                        sp.style.setProperty('--dx', (Math.random() * 90 - 45) + 'px');
                        sp.style.setProperty('--dy', (Math.random() * 90 - 45) + 'px');
                        sp.style.animationDelay = (Math.random() * 0.5) + 's';
                        sparks.appendChild(sp);
                    }
                    setTimeout(function () { sparks.remove(); }, 1500);

                    setTimeout(function () {
                        veil.classList.add('is-out');
                        document.body.classList.remove('is-blackout');
                        if (orb) orb.classList.remove('is-glow');
                        if (Snd.beep) Snd.beep(180, 0.04, 0.3);
                        setTimeout(function () { veil.remove(); }, 700);
                    }, 1800);
                } },

                /* 2. Дверь */
                door: { cost: 12, dur: 4600, run: function () {
                    var wrap = fxEl('fx-door',
                        '<div class="fx-lamp"></div>' +
                        '<div class="fx-fog"></div>' +
                        '<div class="fx-doorway">🚪</div>' +
                        '<div class="fx-exit">выход</div>' +
                        '<div class="fx-exit fx-exit-2">выход</div>');

                    if (Snd.rumble) Snd.rumble();
                    if (Snd.heartbeat) Snd.heartbeat(0.55);

                    setTimeout(function () { wrap.classList.add('is-lamp'); }, 500);
                    setTimeout(function () {
                        wrap.classList.add('is-door');
                        if (Snd.creak) Snd.creak();
                    }, 1100);
                    setTimeout(function () { wrap.classList.add('is-words'); }, 1800);
                    setTimeout(function () {
                        wrap.classList.add('is-near');
                        if (Snd.staticNoise) Snd.staticNoise();
                        if (Snd.steps) Snd.steps();
                    }, 3000);
                    setTimeout(function () {
                        wrap.remove();
                        document.body.classList.add('is-flash-red');
                        setTimeout(function () { document.body.classList.remove('is-flash-red'); }, 420);
                    }, 3800);
                } },

                /* 3. Курсор-надпись */
                cursor: { cost: 4, dur: 2600, run: function () {
                    var orb = document.getElementById('cursorOrb');
                    if (!orb) return;

                    var prev = orb.textContent;
                    orb.textContent = 'выход';
                    orb.classList.add('is-word');
                    if (Snd.whisperSound) Snd.whisperSound();

                    setTimeout(function () {
                        orb.textContent = prev || '🔮';
                        orb.classList.remove('is-word');
                    }, 2400);
                } },

                /* 4. Кто-то печатает */
                type: { cost: 5, dur: 3400, run: function () {
                    var phrases = ['помоги мне', 'ты не один', 'не оборачивайся'];
                    var text = phrases[Math.floor(Math.random() * phrases.length)];
                    var i = 0;
                    var wrap = document.querySelector('.term-input');
                    if (wrap) wrap.classList.add('is-possessed');
                    if (Snd.whisperSound) Snd.whisperSound();

                    input.value = '';

                    var t = setInterval(function () {
                        if (i >= text.length) {
                            clearInterval(t);
                            setTimeout(function () {
                                input.value = '';
                                if (wrap) wrap.classList.remove('is-possessed');
                            }, 2000);
                            return;
                        }
                        input.value += text.charAt(i++);
                        if (Snd.key) Snd.key();
                    }, 120);
                } },

                /* 5. Лишняя строка */
                ghostline: { cost: 5, dur: 6600, run: function () {
                    var div = document.createElement('div');
                    div.className = 'line line-ghost';
                    div.textContent = 'Ты слышишь это?';
                    out.appendChild(div);
                    scrollDown();
                    if (Snd.whisperSound) Snd.whisperSound();

                    setTimeout(function () {
                        div.textContent = 'тут ничего не было';
                        div.classList.add('line-ghost-red');
                        if (Snd.creak) Snd.creak();
                    }, 3000);

                    setTimeout(function () { div.remove(); }, 6400);
                } },

                /* 6. Красная комната */
                redroom: { cost: 10, dur: 4400, run: function () {
                    var wrap = fxEl('fx-red');

                    var word = document.createElement('div');
                    word.className = 'fx-red-word';
                    word.textContent = 'ОНО РЯДОМ';
                    word.style.left = '50%';
                    word.style.top = '50%';
                    wrap.appendChild(word);

                    if (Snd.rumble) Snd.rumble();
                    if (Snd.heartbeat) Snd.heartbeat(0.8);

                    var spots = [['22%', '28%'], ['74%', '22%'], ['38%', '72%'], ['82%', '64%']];
                    var k = 0;

                    var timer = setInterval(function () {
                        if (k >= spots.length) {
                            clearInterval(timer);
                            word.classList.add('is-full');
                            if (Snd.staticNoise) Snd.staticNoise();
                            if (Snd.stinger) Snd.stinger();

                            setTimeout(function () {
                                wrap.remove();
                                document.body.classList.add('is-flash-red');
                                setTimeout(function () { document.body.classList.remove('is-flash-red'); }, 420);
                            }, 800);
                            return;
                        }
                        word.style.left = spots[k][0];
                        word.style.top = spots[k][1];
                        k++;
                    }, 480);
                } },

                /* 7. Глюк интерфейса */
                glitch: { cost: 6, dur: 2400, run: function () {
                    var lines = out.querySelectorAll('.line');
                    var saved = [];

                    Array.prototype.forEach.call(lines, function (el) {
                        saved.push([el, el.textContent]);
                        var junk = '';
                        for (var i = 0; i < 10; i++) {
                            junk += '@#$%^&*'.charAt(Math.floor(Math.random() * 7));
                        }
                        el.textContent = junk;
                    });

                    document.body.classList.add('is-glitch-text');
                    if (Snd.staticNoise) Snd.staticNoise();
                    if (Snd.glitchSound) Snd.glitchSound();

                    setTimeout(function () {
                        saved.forEach(function (pair) { pair[0].textContent = pair[1]; });
                        document.body.classList.remove('is-glitch-text');
                    }, 1300);
                } },

                /* 8. Тень за курсором */
                shadow: { cost: 5, dur: 2800, run: function () {
                    var sh = document.createElement('div');
                    sh.className = 'fx-shadow';
                    document.body.appendChild(sh);

                    function move(e) {
                        sh.style.transform = 'translate(' + (e.clientX + 26) + 'px,' +
                                             (e.clientY + 26) + 'px)';
                    }

                    window.addEventListener('pointermove', move);
                    if (Snd.whisperSound) Snd.whisperSound();
                    if (Snd.heartbeat) Snd.heartbeat(0.45);

                    setTimeout(function () {
                        window.removeEventListener('pointermove', move);
                        sh.classList.add('is-out');
                        setTimeout(function () { sh.remove(); }, 600);
                    }, 2200);
                } },

                /* 9. Стук */
                knock: { cost: 6, dur: 1800, run: function () {
                    if (Snd.knock) Snd.knock();
                    document.body.classList.add('is-shake');
                    setTimeout(function () { document.body.classList.remove('is-shake'); }, 500);
                    setTimeout(function () { think('...стучат?'); }, 700);
                } },

                /* 10. «Кто я?» */
                whoami: { cost: 9, dur: 4600, run: function () {
                    var wrap = fxEl('fx-noise',
                        '<div class="fx-silhouette"></div>' +
                        '<div class="fx-question">Кто ты?</div>');
                    if (Snd.staticNoise) Snd.staticNoise();
                    if (Snd.heartbeat) Snd.heartbeat(0.7);

                    var who = admin ? 'admin' : 'orakul';
                    var broken = '';
                    for (var i = 0; i < who.length; i++) {
                        broken += (i % 2 ? '¤' : who.charAt(i));
                    }

                    setTimeout(function () {
                        line('> ' + broken + '_#%&', 'line-ghost');
                        line('> ' + 'кто ты?'.split('').reverse().join(''), 'line-ghost-red');
                    }, 1200);

                    setTimeout(function () {
                        wrap.remove();
                        document.body.classList.add('is-flash-white');
                        setTimeout(function () { document.body.classList.remove('is-flash-white'); }, 420);
                    }, 4000);
                } },

                /* 11. Матрица */
                matrix: { cost: 14, dur: 3600, run: function () { matrix(); } }
            };

            function runEvent(name) {
                var ev = EVENTS[name];
                if (!ev || eventBusy) return false;

                /* На нуле рассудка ивент — это уже не ивент, а обнуление сюжета */
                if (sanity <= 0) { sanityBreak(); return true; }

                eventBusy = true;
                lastHorrorAt = Date.now();
                changeSanity(-ev.cost);

                /* Стоимость добила рассудок до нуля: сюжет уже сброшен,
                   визуал ивента поверх этого не запускаем */
                if (sanityBroken) return true;

                ev.run();
                setTimeout(function () { eventBusy = false; }, ev.dur || 4000);
                return true;
            }

            /* Случайные ивенты: чем ниже рассудок, тем чаще. Проверка реже,
               чем раньше, — иначе при 50% экран не умолкал. */
            (function horrorLoop() {
                if (reduceMotion) return;

                setTimeout(function () {
                    if (!document.hidden && !eventBusy && !sanityBroken &&
                        Math.random() < horrorChance()) {
                        var keys = Object.keys(EVENTS).filter(function (k) {
                            return k !== 'matrix';   // матрица — отдельная пасхалка
                        });
                        runEvent(keys[Math.floor(Math.random() * keys.length)]);
                    }
                    horrorLoop();
                }, 20000 + Math.random() * 16000);
            })();

            /* Мерцание света — фон, раз в 10–20 секунд */
            (function flickerLoop() {
                if (reduceMotion) return;

                var veil = null;

                function flick() {
                    if (!veil) {
                        veil = document.createElement('div');
                        veil.className = 'flicker-veil';
                        veil.setAttribute('aria-hidden', 'true');
                        document.body.appendChild(veil);
                    }

                    veil.classList.remove('is-on');
                    void veil.offsetWidth;
                    veil.classList.add('is-on');

                    if (Math.random() < 0.4 && Snd.staticNoise) Snd.staticNoise();
                    if (sanity < 30 && Snd.heartbeat) Snd.heartbeat(0.5);

                    var base = sanity < 40 ? 6000 : 10000;
                    setTimeout(flick, base + Math.random() * 8000);
                }

                setTimeout(flick, 5000 + Math.random() * 5000);
            })();

            /* Редкие одиночные эффекты: курсор замирает, заголовок сходит с ума */
            setTimeout(function () {
                if (reduceMotion) return;
                if (O.cursor) O.cursor.freeze(1000);
                if (Snd.staticNoise) Snd.staticNoise();
            }, 22000 + Math.random() * 20000);

            setTimeout(function () {
                if (reduceMotion) return;
                var real = document.title;
                document.title = 'ORAKUL // НЕ ОБОРАЧИВАЙСЯ';
                setTimeout(function () { document.title = real; }, 1800);
            }, 45000 + Math.random() * 30000);

            /* Рассудок НЕ восстанавливается сам по таймеру: за него нужно
               выйти из консоли, заказать пиццу, написать 5045 или дать
               вкладке отдохнуть пять минут. Пассивная утечка — выше. */

            /* ================= ЗАГРУЗКА ================= */
            (function boot() {
                // Восстанавливаем доступ и сюжет после перезагрузки
                if (O.store.get(KEY.admin, false) === true) setAccess(true);
                if (plot.called) boss.state = 'blocked';
                // Ветка увольнения: телефон остался на столе с приложениями.
                // Ветка «Помощь 45»: телефон тоже на столе, orakul.app установлен.
                if (plot.choice === 'fired' || plot.choice === 'help') Phone.restore();

                var steps = [
                    ['OraKul secure shell [v3.7.0]', 'line-title'],
                    ['system.init() ... ok', 'line-dim'],
                    ['connect --secure ... ok', 'line-dim'],
                    ['bypassing loop... done', 'line-dim'],
                    ['проверка подписи ... ok', 'line-dim'],
                    ['синхронизация с ядром фарма ... ok', 'line-dim'],
                    ['модулей загружено: 6/6', 'line-dim'],
                    ['наград в профиле: ' + O.count() + ' / ' + O.TOTAL, 'line-dim'],
                    ['доступ: ' + (admin ? 'admin' : 'гость'), 'line-dim']
                ];

                if (plot.called) {
                    steps.push(['сюжет: босс уже звонил — connect 9054 для повторного звонка', 'line-dim']);
                }

                if (plot.choice === 'fired') {
                    steps.push(['сюжет: телефон на столе — открой приложения', 'line-dim']);
                }

                if (plot.choice === 'help') {
                    steps.push(['сюжет: orakul.app на телефоне — открой список агентов', 'line-dim']);
                }

                steps.push(['', '']);
                steps.push(['Введи help — список команд.', 'line-ok']);

                steps.forEach(function (step, i) {
                    setTimeout(function () {
                        line(step[0], step[1]);
                        if (i === steps.length - 1) {
                            setTimeout(function () { liveReady = true; }, 400);
                        }
                    }, i * 90);
                });

                // На тач-устройствах не выдёргиваем экранную клавиатуру сами
                if (O.finePointer) {
                    setTimeout(function () { input.focus(); }, steps.length * 90 + 300);
                }
            })();

            /* ================= СИНХРОНИЗАЦИЯ ПРОГРЕССА ================= */
            // Сюжет и доступ могли сбросить в другой вкладке или на странице
            // достижений — подхватываем и приводим шапку в соответствие
            document.addEventListener('orakul:sync', function (e) {
                var reason = e.detail && e.detail.reason;

                setAccess(O.store.get(KEY.admin, false) === true);
                plot = readPlot();
                if (plot.called && boss.state === 'idle') boss.state = 'blocked';
                if (!plot.called && boss.state === 'blocked') boss.state = 'idle';

                // Сброс сюжета в другой вкладке убирает телефон со стола
                if (!plot.called && phoneEl.classList.contains('is-in')) Phone.reset();

                // Комната (кулер, автомат, взлом) тоже обнуляется
                if (reason === 'reset' || reason === 'plotreset') {
                    resetRoom(false);
                    Phone.reset();
                    unknown.state = 'idle';
                    boss.state = 'idle';
                }

                // Полный сброс — рассудок тоже начинается с чистого листа
                if (reason === 'reset') {
                    sanity = 100;
                    sanityBroken = false;
                    saveSanity();
                    renderSanity();
                }

                // Изменение в другой вкладке: подтягиваем комнату и рассудок
                if (reason === 'storage') {
                    reloadRoom();
                    if (!O.store.get('phone.state', null) && phoneEl.classList.contains('is-in')) {
                        Phone.reset();
                    }
                    var sv = O.store.get('console.sanity', 100);
                    if (typeof sv === 'number' && isFinite(sv)) {
                        sanity = Math.max(0, Math.min(100, sv));
                        if (sanity > 0) sanityBroken = false;
                        renderSanity();
                    }
                }

                // Облако принесло сюжет: подтягиваем комнату и телефон
                if (reason === 'cloud') {
                    reloadRoom();
                    if (!phoneEl.classList.contains('is-in') && O.store.get('phone.state', null)) {
                        Phone.restore();
                    }
                }
            });

            /* ================= ЗВУК КЛИКОВ ================= */
            document.addEventListener('click', function (e) {
                var el = e.target.closest && e.target.closest('a, button');
                if (!el) return;
                if (el.id === 'soundToggle' || el.id === 'themeToggle') return;
                if (el.closest('.term')) return;
                if (el.closest('#phone')) return;
                if (el.closest('#hackModal')) return;   // у кнопок игры свой тон
                Snd.orb(0.4);
            });
        })();
    </script>
</body>
