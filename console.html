<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0f0c1b">
    <meta name="description" content="Скрытая консоль Оракула. Команды, пасхалки и кое-кто на связи.">
    <title>Консоль — Оракул</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔮</text></svg>">
    <link rel="stylesheet" href="common.css">
    <style>
        :root {
            --mono: ui-monospace, 'Cascadia Code', 'JetBrains Mono', Consolas, 'Courier New', monospace;
        }

        body {
            font-family: var(--mono);
            background-image: radial-gradient(circle at 50% 0%, rgba(138, 43, 226, 0.14), transparent 62%);
        }

        html[data-theme="light"] body {
            background-image: radial-gradient(circle at 50% 0%, rgba(124, 58, 237, 0.1), transparent 62%);
        }

        /* ===== Сканлайны ===== */
        .scanlines {
            position: fixed;
            inset: 0;
            z-index: 1;
            pointer-events: none;
            background: repeating-linear-gradient(
                to bottom,
                rgba(255, 255, 255, 0.022) 0px,
                rgba(255, 255, 255, 0.022) 1px,
                transparent 1px,
                transparent 3px
            );
            mix-blend-mode: overlay;
        }

        html[data-theme="light"] .scanlines { opacity: 0.35; }

        /* ===== Верхняя панель ===== */
        .topbar {
            position: sticky;
            top: 0;
            z-index: 40;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 14px;
            padding: 12px 20px;
            background: rgba(15, 12, 27, 0.72);
            border-bottom: 1px solid var(--line);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
        }

        html[data-theme="light"] .topbar { background: rgba(255, 255, 255, 0.78); }

        .back {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.82rem;
            letter-spacing: 0.5px;
            transition: color 0.2s ease, text-shadow 0.2s ease;
        }

        .back:hover { color: var(--accent-2); text-shadow: 0 0 14px var(--accent-2); }

        .tag {
            font-size: 0.76rem;
            letter-spacing: 1.5px;
            color: var(--accent-2);
            text-shadow: 0 0 14px var(--glow);
        }

        .topbar-tools { display: flex; align-items: center; gap: 10px; }

        /* ===== Сцена ===== */
        .stage {
            position: relative;
            z-index: 2;
            max-width: 980px;
            margin: 0 auto;
            padding: 28px 18px 90px;
            transition: max-width 0.5s ease;
        }

        /* Когда справа выезжает телефон — сцена шире, консоль уже */
        .stage.has-phone { max-width: 1220px; }

        .stage-row { display: flex; align-items: flex-start; gap: 18px; }

        .stage-row .term {
            flex: 1 1 100%;
            min-width: 0;
            transition: flex-basis 0.5s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        .stage-row.has-phone .term { flex-basis: 60%; }

        /* ===== Терминал ===== */
        .term {
            border-radius: 16px;
            border: 1px solid rgba(138, 43, 226, 0.35);
            background: rgba(12, 9, 20, 0.9);
            box-shadow:
                0 24px 70px rgba(0, 0, 0, 0.55),
                0 0 46px rgba(138, 43, 226, 0.2),
                inset 0 0 60px rgba(138, 43, 226, 0.06);
            overflow: hidden;
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
        }

        html[data-theme="light"] .term {
            background: rgba(255, 255, 255, 0.92);
            border-color: rgba(124, 58, 237, 0.3);
            box-shadow: 0 24px 60px rgba(87, 42, 160, 0.16), 0 0 40px rgba(124, 58, 237, 0.12);
        }

        .term-bar {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 14px;
            background: rgba(28, 20, 44, 0.95);
            border-bottom: 1px solid rgba(138, 43, 226, 0.22);
            font-size: 0.72rem;
            letter-spacing: 0.5px;
            color: var(--text-muted);
        }

        html[data-theme="light"] .term-bar {
            background: rgba(244, 240, 255, 0.96);
            border-bottom-color: rgba(124, 58, 237, 0.18);
        }

        .dots { display: inline-flex; gap: 6px; }

        .dots i {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #4b3a6b;
        }

        .dots i:nth-child(1) { background: #ff5f57; }
        .dots i:nth-child(2) { background: #febc2e; }
        .dots i:nth-child(3) { background: #28c840; }

        .term-title {
            flex: 1 1 auto;
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .term-status {
            padding: 2px 10px;
            border-radius: 999px;
            font-size: 0.66rem;
            letter-spacing: 1.2px;
            text-transform: uppercase;
            color: #6ee7a8;
            border: 1px solid rgba(110, 231, 168, 0.35);
            background: rgba(110, 231, 168, 0.08);
        }

        .term-status.is-broken {
            color: #ff7a7a;
            border-color: rgba(255, 122, 122, 0.4);
            background: rgba(255, 122, 122, 0.08);
        }

        /* ===== Уровень доступа в шапке ===== */
        .access {
            padding: 2px 10px;
            border-radius: 999px;
            font-size: 0.66rem;
            letter-spacing: 1.2px;
            text-transform: uppercase;
            color: var(--text-muted);
            border: 1px solid var(--line);
            background: rgba(255, 255, 255, 0.04);
            transition: color 0.3s ease, border-color 0.3s ease,
                        background-color 0.3s ease, box-shadow 0.3s ease;
        }

        .access.is-admin {
            color: #ffd97a;
            border-color: rgba(255, 217, 122, 0.45);
            background: rgba(255, 217, 122, 0.1);
            box-shadow: 0 0 16px rgba(255, 217, 122, 0.25);
        }

        html[data-theme="light"] .access { border-color: rgba(124, 58, 237, 0.2); }

        html[data-theme="light"] .access.is-admin {
            color: #9a6b00;
            border-color: rgba(154, 107, 0, 0.35);
            background: rgba(255, 217, 122, 0.3);
        }

        /* ===== Тело терминала ===== */
        .term-body {
            padding: 18px 18px 8px;
            min-height: 46vh;
            max-height: 62vh;
            overflow-y: auto;
            overflow-x: hidden;
            font-size: 0.86rem;
            line-height: 1.65;
            color: var(--text-main);
            scrollbar-width: thin;
            scrollbar-color: rgba(138, 43, 226, 0.6) transparent;
        }

        .term-body::-webkit-scrollbar { width: 8px; }
        .term-body::-webkit-scrollbar-track { background: transparent; }

        .term-body::-webkit-scrollbar-thumb {
            background: rgba(138, 43, 226, 0.45);
            border-radius: 8px;
        }

        .line {
            white-space: pre-wrap;
            word-break: break-word;
            min-height: 1.2em;
        }

        .line-title {
            color: var(--accent-2);
            font-weight: 700;
            letter-spacing: 0.5px;
            text-shadow: 0 0 16px var(--glow);
        }

        .line-ok { color: #7ee2b8; }
        .line-dim { color: var(--text-muted); }
        .line-err { color: #ff7a7a; }

        .line-echo { color: var(--accent-2); }

        /* Приглашение берётся из data-prompt: после login оно admin@orakul */
        .line-echo::before {
            content: attr(data-prompt);
            color: var(--text-muted);
        }

        .line-dialog {
            color: #d9c7ff;
            font-weight: 600;
        }

        html[data-theme="light"] .line-dialog { color: #4c2a8f; }

        .p { color: var(--accent-2); font-weight: 700; }

        .granted {
            color: #ffd97a;
            text-shadow: 0 0 14px rgba(255, 217, 122, 0.5);
            font-weight: 700;
        }

        /* ===== Матрица ===== */
        .matrix {
            display: flex;
            flex-direction: column;
            gap: 1px;
            margin: 6px 0 10px;
            font-size: 0.72rem;
            line-height: 1.1;
            color: #57ff9a;
            text-shadow: 0 0 8px rgba(87, 255, 154, 0.7);
            overflow: hidden;
            max-height: 220px;
        }

        .matrix span {
            white-space: nowrap;
            animation: matrixIn 0.4s ease both;
        }

        @keyframes matrixIn {
            from { opacity: 0; transform: translateX(-10px); }
            to   { opacity: 1; transform: none; }
        }

        /* ===== Хоррор: мерцание света ===== */
        .flicker-veil {
            position: fixed;
            inset: 0;
            z-index: 1500;
            background: #05040a;
            opacity: 0;
            pointer-events: none;
        }

        .flicker-veil.is-on { animation: flick 0.1s steps(1) 1; }

        @keyframes flick {
            0%   { opacity: 0; }
            20%  { opacity: 0.9; }
            40%  { opacity: 0.15; }
            60%  { opacity: 0.75; }
            100% { opacity: 0; }
        }

        /* Строка-призрак в логе */
        .line-ghost {
            color: #b38ae0;
            letter-spacing: 0.08em;
            text-shadow: 0 0 14px rgba(199, 125, 255, 0.45);
            animation: ghostIn 1.8s ease both;
        }

        @keyframes ghostIn {
            0%   { opacity: 0; filter: blur(3px); }
            30%  { opacity: 0.9; filter: blur(0); }
            70%  { opacity: 0.4; }
            100% { opacity: 0.78; }
        }

        /* ===== Матрица на весь экран ===== */
        .matrix-rain {
            position: fixed;
            inset: 0;
            z-index: 2000;
            background: #000;
            overflow: hidden;
            cursor: none;
        }

        .matrix-rain canvas { display: block; width: 100%; height: 100%; }

        .matrix-rain.is-glitch { animation: matrixGlitch 0.16s steps(2) infinite; }

        @keyframes matrixGlitch {
            0%   { transform: translate(0, 0); filter: hue-rotate(0deg); }
            25%  { transform: translate(-7px, 2px); filter: hue-rotate(60deg) contrast(1.6); }
            50%  { transform: translate(6px, -3px); filter: hue-rotate(-40deg); }
            75%  { transform: translate(-4px, -2px); filter: hue-rotate(120deg) contrast(1.4); }
            100% { transform: translate(0, 0); filter: hue-rotate(0deg); }
        }

        .matrix-hint {
            position: absolute;
            left: 50%;
            bottom: 44px;
            transform: translateX(-50%);
            font-family: var(--mono);
            font-size: 0.78rem;
            letter-spacing: 0.4em;
            color: #57ff9a;
            text-shadow: 0 0 16px rgba(87, 255, 154, 0.8);
            opacity: 0.75;
            text-transform: lowercase;
        }

        /* ===== Рассудок ===== */
        .sanity {
            position: fixed;
            right: 18px;
            bottom: 96px;
            z-index: 950;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            font-family: var(--mono);
            color: var(--text-muted);
            pointer-events: none;
        }

        .sanity-track {
            position: relative;
            width: 10px;
            height: 180px;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(199, 125, 255, 0.25);
            overflow: hidden;
        }

        .sanity-fill {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;
            height: 100%;
            border-radius: 999px;
            background: linear-gradient(180deg, #c77dff, #6d28d9);
            box-shadow: 0 0 16px rgba(199, 125, 255, 0.6);
            transition: height 0.6s cubic-bezier(0.2, 0.8, 0.3, 1);
        }

        .sanity.is-low .sanity-fill {
            background: linear-gradient(180deg, #ff6b81, #8a1a2a);
            box-shadow: 0 0 18px rgba(255, 80, 100, 0.7);
        }

        .sanity-num { font-size: 0.72rem; letter-spacing: 0.05em; }
        .sanity-emoji {
            font-size: 1.2rem;
            line-height: 1;
            filter: drop-shadow(0 0 8px rgba(199, 125, 255, 0.5));
        }

        /* ---- Рассудок на исходе ---- */
        .sanity.is-critical .sanity-fill {
            background: linear-gradient(180deg, #ff2b3d, #5c0a14);
            animation: sanityPulse 0.9s ease-in-out infinite;
        }

        .sanity.is-critical .sanity-emoji { animation: sanityShake 0.5s steps(2) infinite; }
        .sanity.is-broken { animation: sanityShake 0.4s steps(2) infinite; }

        @keyframes sanityPulse {
            0%, 100% { box-shadow: 0 0 14px rgba(255, 40, 60, 0.55); }
            50%      { box-shadow: 0 0 30px rgba(255, 40, 60, 0.95); }
        }

        @keyframes sanityShake {
            0%, 100% { transform: translate(0, 0); }
            25%      { transform: translate(-1px, 1px); }
            75%      { transform: translate(1px, -1px); }
        }

        /* Красная пелена по краям: чем ниже рассудок, тем гуще */
        .sanity-veil {
            position: fixed;
            inset: 0;
            z-index: 890;
            pointer-events: none;
            opacity: 0;
            background: radial-gradient(circle at 50% 50%,
                        transparent 38%, rgba(70, 0, 8, 0.45) 72%, rgba(40, 0, 4, 0.86) 100%);
            transition: opacity 1.2s ease;
            mix-blend-mode: multiply;
        }

        /* «+N%» рядом со шкалой */
        .sanity-pop {
            position: fixed;
            right: 52px;
            bottom: 150px;
            z-index: 960;
            font-family: var(--mono);
            font-size: 0.82rem;
            letter-spacing: 0.06em;
            color: #9df3c8;
            text-shadow: 0 0 14px rgba(80, 255, 170, 0.8);
            pointer-events: none;
            animation: sanityPop 1.6s ease forwards;
        }

        .sanity-pop.is-down {
            color: #ff7b8a;
            text-shadow: 0 0 14px rgba(255, 60, 80, 0.85);
        }

        @keyframes sanityPop {
            0%   { opacity: 0; transform: translateY(8px) scale(0.9); }
            18%  { opacity: 1; transform: translateY(0) scale(1.05); }
            60%  { opacity: 0.95; }
            100% { opacity: 0; transform: translateY(-26px) scale(1); }
        }

        /* ===== Обнуление сюжета: разум разрушен ===== */
        .fx-sanity-break {
            position: fixed;
            inset: 0;
            z-index: 1900;
            overflow: hidden;
            pointer-events: none;
            background:
                radial-gradient(circle at 50% 46%, rgba(255, 40, 50, 0.34), transparent 34%),
                radial-gradient(circle at 50% 50%, rgba(90, 0, 8, 0.96), rgba(24, 0, 2, 0.99));
            animation: sanityBreakIn 0.4s ease forwards;
            transition: opacity 0.6s ease;
        }

        .fx-sanity-break.is-out { animation: none; opacity: 0; }

        .fx-sanity-break::before {
            content: "";
            position: absolute;
            inset: -20%;
            background:
                repeating-conic-gradient(from 0deg at 50% 50%,
                    rgba(255, 60, 70, 0.16) 0deg 2deg, transparent 2deg 9deg);
            animation: sanitySpin 9s linear infinite;
            opacity: 0.7;
        }

        .fx-sanity-break::after {
            content: "";
            position: absolute;
            inset: 0;
            background:
                repeating-linear-gradient(0deg, rgba(255, 255, 255, 0.06) 0 1px, transparent 1px 3px);
            animation: noiseShift 0.1s steps(2) infinite;
            mix-blend-mode: screen;
            opacity: 0.5;
        }

        @keyframes sanityBreakIn {
            from { opacity: 0; filter: brightness(2.4); }
            to   { opacity: 1; filter: brightness(1); }
        }

        @keyframes sanitySpin { to { transform: rotate(360deg); } }

        .fx-sanity-cracks {
            position: absolute;
            inset: 0;
            background:
                linear-gradient(115deg, transparent 48.8%, rgba(255, 90, 100, 0.55) 49.2%, transparent 49.6%),
                linear-gradient(64deg, transparent 46.9%, rgba(255, 90, 100, 0.4) 47.3%, transparent 47.8%),
                linear-gradient(152deg, transparent 62.5%, rgba(255, 120, 130, 0.32) 62.9%, transparent 63.4%),
                linear-gradient(28deg, transparent 28.4%, rgba(255, 90, 100, 0.35) 28.8%, transparent 29.2%);
            filter: blur(0.4px);
            animation: crackPulse 0.45s steps(2) infinite;
        }

        @keyframes crackPulse {
            0%, 100% { opacity: 0.65; }
            50%      { opacity: 1; }
        }

        .fx-sanity-text {
            position: absolute;
            left: 50%;
            top: 45%;
            transform: translate(-50%, -50%);
            font-family: var(--mono);
            font-weight: 800;
            font-size: clamp(1.5rem, 6vw, 3.6rem);
            letter-spacing: 0.18em;
            text-align: center;
            color: #ff2b3d;
            text-shadow:
                0 0 18px rgba(255, 30, 50, 1),
                0 0 60px rgba(255, 30, 50, 0.7);
            animation: sanityTextIn 0.5s cubic-bezier(0.2, 0.9, 0.3, 1.4) both,
                       sanityTextFlicker 0.9s steps(2) 0.5s infinite;
        }

        .fx-sanity-sub {
            position: absolute;
            left: 50%;
            top: 58%;
            transform: translateX(-50%);
            width: min(90vw, 640px);
            text-align: center;
            font-family: var(--mono);
            font-size: clamp(0.68rem, 1.9vw, 0.92rem);
            letter-spacing: 0.18em;
            text-transform: uppercase;
            color: rgba(255, 200, 205, 0.82);
            text-shadow: 0 0 16px rgba(255, 40, 60, 0.8);
            animation: subFadeIn 0.6s ease 0.15s both;
        }

        @keyframes sanityTextIn {
            from { opacity: 0; transform: translate(-50%, -50%) scale(1.5); filter: blur(6px); }
            to   { opacity: 1; transform: translate(-50%, -50%) scale(1); filter: blur(0); }
        }

        @keyframes subFadeIn {
            from { opacity: 0; transform: translate(-50%, 8px); }
            to   { opacity: 1; transform: translate(-50%, 0); }
        }

        @keyframes sanityTextFlicker {
            0%, 100% { opacity: 1; }
            45%      { opacity: 0.55; }
            50%      { opacity: 1; }
            72%      { opacity: 0.7; }
        }

        /* Тряска всего экрана при разрушении разума */
        body.is-sanity-broken .stage,
        body.is-sanity-broken .topbar {
            animation: sanityScreenShake 0.55s cubic-bezier(0.36, 0.07, 0.19, 0.97);
        }

        @keyframes sanityScreenShake {
            0%, 100% { transform: translate(0, 0); }
            12% { transform: translate(-12px, 6px) rotate(-0.4deg); }
            28% { transform: translate(10px, -7px) rotate(0.4deg); }
            46% { transform: translate(-8px, 3px); }
            64% { transform: translate(6px, -4px); }
            82% { transform: translate(-3px, 2px); }
        }

        /* ===== Ошибка выхода (Please Don't Touch Anything) ===== */
        .fx-exit-error {
            position: fixed;
            left: 50%;
            top: 50%;
            z-index: 1800;
            transform: translate(-50%, -50%);
            max-width: min(520px, 88vw);
            padding: 18px 22px;
            border: 1px solid rgba(255, 60, 80, 0.85);
            border-radius: 10px;
            background: rgba(28, 0, 4, 0.94);
            box-shadow: 0 0 46px rgba(255, 30, 50, 0.5), inset 0 0 30px rgba(255, 30, 50, 0.12);
            font-family: var(--mono);
            color: #ffd7da;
            text-align: center;
            pointer-events: none;
            animation: exitErrorIn 0.22s ease both, exitErrorFlicker 0.16s steps(2) 0.22s infinite;
            transition: opacity 0.3s ease;
        }

        .fx-exit-error.is-out { animation: none; opacity: 0; }

        .fx-exit-error b {
            display: block;
            font-size: 0.92rem;
            letter-spacing: 0.12em;
            color: #ff2b3d;
            text-shadow: 0 0 18px rgba(255, 30, 50, 0.9);
        }

        .fx-exit-error span {
            display: block;
            margin-top: 8px;
            font-size: 0.72rem;
            letter-spacing: 0.06em;
            color: rgba(255, 190, 196, 0.8);
        }

        @keyframes exitErrorIn {
            from { opacity: 0; transform: translate(-50%, -50%) scale(0.9); filter: blur(3px); }
            to   { opacity: 1; transform: translate(-50%, -50%) scale(1); filter: blur(0); }
        }

        @keyframes exitErrorFlicker {
            0%, 100% { opacity: 1; }
            50%      { opacity: 0.72; }
        }

        body.is-exit-error::before {
            content: "";
            position: fixed;
            inset: 0;
            z-index: 1750;
            pointer-events: none;
            background: rgba(120, 0, 10, 0.28);
            animation: exitErrorTint 0.3s ease both;
        }

        @keyframes exitErrorTint {
            from { opacity: 0; }
            to   { opacity: 1; }
        }

        /* ===== Дополнительные слои для ивентов ===== */
        .fx-sparks { position: absolute; inset: 0; pointer-events: none; }

        .fx-spark {
            position: absolute;
            width: 3px;
            height: 3px;
            border-radius: 50%;
            background: #fff;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.9);
            opacity: 0;
            animation: sparkFly 1.1s ease-out forwards;
        }

        @keyframes sparkFly {
            0%   { opacity: 0; transform: translate(0, 0) scale(0.4); }
            12%  { opacity: 1; }
            100% { opacity: 0; transform: translate(var(--dx), var(--dy)) scale(1); }
        }

        .fx-fog {
            position: absolute;
            inset: 0;
            background:
                radial-gradient(ellipse at 30% 70%, rgba(190, 190, 210, 0.16), transparent 60%),
                radial-gradient(ellipse at 70% 30%, rgba(160, 160, 190, 0.12), transparent 62%);
            animation: fogDrift 6s ease-in-out infinite alternate;
            pointer-events: none;
        }

        @keyframes fogDrift {
            from { transform: translate3d(-2%, 0, 0) scale(1.02); opacity: 0.55; }
            to   { transform: translate3d(2%, -1%, 0) scale(1.06); opacity: 0.85; }
        }

        .fx-red::after {
            content: "";
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at 50% 50%, transparent 30%, rgba(0, 0, 0, 0.7) 100%);
            animation: redBreath 2.2s ease-in-out infinite;
            pointer-events: none;
        }

        @keyframes redBreath {
            0%, 100% { opacity: 0.55; }
            50%      { opacity: 0.95; }
        }

        /* ===== Слой хоррор-эффектов ===== */
        .fx-layer {
            position: fixed;
            inset: 0;
            z-index: 1400;
            pointer-events: none;
            overflow: hidden;
        }

        /* 1. Выключение энергии */
        .fx-blackout {
            position: absolute;
            inset: 0;
            background: #000;
            opacity: 0;
            animation: blackoutIn 0.25s ease forwards;
        }

        .fx-blackout.is-out {
            opacity: 1;
            animation: blackoutOut 0.5s ease forwards;
        }

        @keyframes blackoutIn { from { opacity: 0; } to { opacity: 0.97; } }
        @keyframes blackoutOut { from { opacity: 0.97; } to { opacity: 0; } }

        .cursor-orb.is-glow {
            filter: drop-shadow(0 0 26px rgba(255, 255, 255, 0.95)) brightness(1.6);
            z-index: 1600;
        }

        /* 2. Дверь */
        .fx-door {
            position: absolute;
            inset: 0;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            animation: blackoutIn 0.4s ease forwards;
        }

        .fx-lamp {
            position: absolute;
            left: 50%;
            top: 0;
            width: 320px;
            height: 320px;
            margin-left: -160px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255, 240, 190, 0.55), transparent 70%);
            opacity: 0;
            transition: opacity 0.5s ease;
        }

        .fx-door.is-lamp .fx-lamp { opacity: 1; }

        .fx-doorway {
            font-size: 4rem;
            opacity: 0;
            transform: scale(0.6);
            transition: opacity 0.6s ease, transform 1.2s cubic-bezier(0.3, 0.8, 0.3, 1);
            filter: drop-shadow(0 0 22px rgba(255, 255, 255, 0.25));
        }

        .fx-door.is-door .fx-doorway { opacity: 1; transform: scale(1); }

        .fx-door.is-near .fx-doorway {
            transform: scale(7);
            opacity: 1;
            transition: transform 0.8s cubic-bezier(0.7, 0, 0.9, 0.2);
        }

        .fx-exit {
            position: absolute;
            left: 30%;
            top: 62%;
            font-family: var(--mono);
            font-size: 0.9rem;
            letter-spacing: 0.35em;
            color: #ff3b4e;
            text-shadow: 0 0 18px rgba(255, 40, 60, 0.9);
            opacity: 0;
            transition: opacity 0.8s ease, transform 2s linear;
        }

        .fx-exit-2 { left: 62%; top: 30%; }

        .fx-door.is-words .fx-exit { opacity: 0.85; transform: translateY(-14px); }
        .fx-door.is-words .fx-exit-2 { opacity: 0.6; transform: translateY(12px); }

        /* 3. Курсор-надпись */
        .cursor-orb.is-word {
            font-size: 0.62rem;
            letter-spacing: 0.12em;
            color: #ff5a6a;
            background: none;
            filter: drop-shadow(0 0 14px rgba(255, 60, 80, 0.9));
        }

        /* 4. Кто-то печатает — подсветка ввода */
        .term-input.is-possessed input {
            color: #ff7b8a;
            text-shadow: 0 0 12px rgba(255, 80, 100, 0.6);
        }

        /* 5. Лишняя строка */
        .line-ghost-red {
            color: #ff4d5e;
            text-shadow: 0 0 14px rgba(255, 40, 60, 0.7);
            letter-spacing: 0.06em;
        }

        /* 6. Красная комната */
        .fx-red {
            position: absolute;
            inset: 0;
            background: rgba(80, 0, 6, 0.92);
            animation: blackoutIn 0.5s ease forwards;
        }

        .fx-red-word {
            position: absolute;
            font-family: var(--mono);
            font-weight: 800;
            font-size: clamp(1.4rem, 5vw, 3rem);
            letter-spacing: 0.14em;
            color: #ff2b3d;
            text-shadow: 0 0 26px rgba(255, 30, 50, 0.95);
            transform: translate(-50%, -50%);
            transition: left 0.28s steps(2), top 0.28s steps(2), font-size 0.5s ease;
        }

        .fx-red-word.is-full {
            left: 50% !important;
            top: 50% !important;
            font-size: 22vw;
            opacity: 0.95;
        }

        /* 7. Глюк текста */
        body.is-glitch-text .term-body {
            animation: textGlitch 0.18s steps(2) infinite;
            filter: hue-rotate(-30deg) contrast(1.3);
        }

        @keyframes textGlitch {
            0%   { transform: translate(0, 0); }
            25%  { transform: translate(-2px, 1px); }
            50%  { transform: translate(2px, -1px); }
            75%  { transform: translate(-1px, -1px); }
            100% { transform: translate(0, 0); }
        }

        /* 8. Тень за курсором */
        .fx-shadow {
            position: fixed;
            left: 0;
            top: 0;
            z-index: 1200;
            width: 26px;
            height: 26px;
            margin: -13px 0 0 -13px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(10, 6, 16, 0.95), rgba(10, 6, 16, 0) 70%);
            filter: blur(3px);
            pointer-events: none;
            transition: transform 0.18s linear, opacity 0.5s ease;
        }

        .fx-shadow.is-out { opacity: 0; }

        /* 9. Стук */
        body.is-shake .stage,
        body.is-shake .topbar {
            animation: screenShake 0.42s cubic-bezier(0.36, 0.07, 0.19, 0.97);
        }

        @keyframes screenShake {
            0%, 100% { transform: translate(0, 0); }
            15% { transform: translate(-9px, 4px); }
            30% { transform: translate(8px, -5px); }
            45% { transform: translate(-6px, 2px); }
            60% { transform: translate(5px, -3px); }
            80% { transform: translate(-3px, 1px); }
        }

        /* 10. «Кто я?» */
        .fx-noise {
            position: absolute;
            inset: 0;
            background:
                repeating-linear-gradient(0deg, rgba(255,255,255,0.16) 0 1px, transparent 1px 3px),
                repeating-linear-gradient(90deg, rgba(255,255,255,0.08) 0 1px, transparent 1px 4px),
                #d8d8d8;
            animation: noiseShift 0.12s steps(2) infinite;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        @keyframes noiseShift {
            0%   { background-position: 0 0, 0 0; }
            50%  { background-position: 3px 5px, -4px 2px; }
            100% { background-position: -2px 4px, 5px -3px; }
        }

        .fx-silhouette {
            width: 160px;
            height: 220px;
            border-radius: 50% 50% 18% 18% / 42% 42% 10% 10%;
            background: radial-gradient(circle at 50% 32%, #14101c 32%, #05040a 72%);
            box-shadow: 0 0 60px rgba(0, 0, 0, 0.85);
            filter: blur(1px);
            animation: silhouetteIn 1.2s ease both;
        }

        @keyframes silhouetteIn {
            from { opacity: 0; transform: scale(0.92); filter: blur(6px); }
            to   { opacity: 1; transform: scale(1); filter: blur(1px); }
        }

        .fx-question {
            position: absolute;
            bottom: 22%;
            font-family: var(--mono);
            font-size: clamp(1.1rem, 3.4vw, 1.8rem);
            letter-spacing: 0.2em;
            color: #1a1024;
            text-shadow: 0 0 18px rgba(255, 255, 255, 0.9);
        }

        /* Сброс — белая вспышка после ивента */
        body.is-flash-red::after,
        body.is-flash-white::after {
            content: "";
            position: fixed;
            inset: 0;
            z-index: 1700;
            pointer-events: none;
        }

        body.is-flash-red::after { background: rgba(255, 30, 40, 0.55); animation: flashOut 0.35s ease forwards; }
        body.is-flash-white::after { background: rgba(255, 255, 255, 0.85); animation: flashOut 0.35s ease forwards; }

        @keyframes flashOut { from { opacity: 1; } to { opacity: 0; } }

        /* ===== Мысли: прилёт снизу с приземлением ===== */
        .subtitle.is-in {
            animation: subIn 0.5s cubic-bezier(0.2, 0.9, 0.3, 1.35);
        }

        @keyframes subIn {
            0%   { transform: translate(-50%, 30px) scale(0.96); }
            60%  { transform: translate(-50%, -4px) scale(1.01); }
            100% { transform: translate(-50%, 0) scale(1); }
        }

        @media (max-width: 640px) {
            .sanity { right: 10px; bottom: 150px; transform: scale(0.85); transform-origin: right bottom; }
            .sanity-track { height: 120px; }
        }

        /* ===== Строка ввода ===== */
        .term-input {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 18px 16px;
            border-top: 1px solid rgba(138, 43, 226, 0.18);
        }

        .prompt {
            flex: 0 0 auto;
            font-size: 0.84rem;
            color: var(--accent-2);
            text-shadow: 0 0 12px var(--glow);
        }

        .term-input input {
            flex: 1 1 auto;
            min-width: 0;
            padding: 6px 2px;
            font-family: var(--mono);
            font-size: 0.88rem;
            color: var(--text-main);
            background: transparent;
            border: none;
            outline: none;
            caret-color: var(--accent-2);
        }

        .term-input input::placeholder { color: rgba(154, 140, 184, 0.5); }

        .hint {
            margin-top: 16px;
            text-align: center;
            font-size: 0.78rem;
            color: var(--text-muted);
        }

        .hint code {
            padding: 2px 7px;
            border-radius: 6px;
            font-family: var(--mono);
            font-size: 0.78rem;
            color: var(--accent-2);
            background: rgba(138, 43, 226, 0.14);
            border: 1px solid rgba(138, 43, 226, 0.28);
        }

        /* ===== Кликабельные варианты ответа ===== */
        .opts {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 6px;
            margin: 4px 0 10px;
        }

        .opts-label {
            font-size: 0.78rem;
            color: var(--text-muted);
            margin-bottom: 2px;
        }

        .opt {
            max-width: 100%;
            padding: 5px 12px;
            border-radius: 8px;
            font-family: var(--mono);
            font-size: 0.8rem;
            line-height: 1.5;
            text-align: left;
            color: #d9c7ff;
            background: rgba(138, 43, 226, 0.1);
            border: 1px solid rgba(138, 43, 226, 0.3);
            cursor: pointer;
            transition: color 0.2s ease, border-color 0.2s ease,
                        background-color 0.2s ease, transform 0.2s ease;
        }

        .opt:hover:not(:disabled),
        .opt:focus-visible {
            color: #fff;
            border-color: rgba(199, 125, 255, 0.7);
            background: rgba(138, 43, 226, 0.24);
            transform: translateX(3px);
        }

        .opt:focus-visible { outline: 2px solid rgba(199, 125, 255, 0.6); outline-offset: 2px; }

        .opt.is-locked {
            color: var(--text-muted);
            border-style: dashed;
            background: transparent;
        }

        .opt.is-used {
            opacity: 0.35;
            cursor: default;
        }

        .opt:disabled { pointer-events: none; }

        html[data-theme="light"] .opt {
            color: #4c2a8f;
            background: rgba(124, 58, 237, 0.08);
            border-color: rgba(124, 58, 237, 0.28);
        }

        html[data-theme="light"] .opt:hover:not(:disabled),
        html[data-theme="light"] .opt:focus-visible {
            color: #2a1157;
            background: rgba(124, 58, 237, 0.16);
        }

        /* ===== Телефон (сюжетный звонок) ===== */
        /* Колонка: сам телефон и карточка под ним */
        .phone-col {
            display: none;
            flex: 0 0 40%;
            min-width: 0;
            flex-direction: column;
            gap: 10px;
        }

        .phone-col.is-in { display: flex; }

        .phone {
            display: none;
            width: 100%;
            min-width: 0;
            position: relative;
            z-index: 3;
        }

        .phone.is-in {
            display: block;
            animation: phoneIn 0.55s cubic-bezier(0.2, 0.8, 0.2, 1) both;
        }

        .phone-under {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        @keyframes phoneIn {
            from { opacity: 0; transform: translateX(80px); }
            to   { opacity: 1; transform: none; }
        }

        .phone.is-shaking .phone-shell { animation: phoneShake 0.42s ease; }

        @keyframes phoneShake {
            0%, 100% { transform: none; }
            20% { transform: translateX(-4px) rotate(-0.6deg); }
            40% { transform: translateX(4px) rotate(0.6deg); }
            60% { transform: translateX(-3px); }
            80% { transform: translateX(2px); }
        }

        .phone-shell {
            position: relative;
            max-width: 300px;
            margin-left: auto;
            padding: 9px;
            border-radius: 44px;
            background: linear-gradient(160deg, #2b2044, #100c1c 62%, #1a1430 100%);
            border: 1px solid rgba(160, 120, 255, 0.35);
            box-shadow:
                0 34px 80px rgba(0, 0, 0, 0.65),
                0 0 46px rgba(138, 43, 226, 0.26),
                inset 0 1px 0 rgba(255, 255, 255, 0.14),
                inset 0 -1px 0 rgba(0, 0, 0, 0.5);
        }

        /* Боковые кнопки корпуса: громкость слева, питание справа */
        .phone-shell::before,
        .phone-shell::after {
            content: "";
            position: absolute;
            width: 3px;
            border-radius: 2px;
            background: linear-gradient(180deg, #3a2c58, #1a1430);
            box-shadow: inset 0 0 0 1px rgba(160, 120, 255, 0.22);
        }

        .phone-shell::before {
            left: -3px;
            top: 96px;
            height: 28px;
            box-shadow: 0 38px 0 #241a3a, inset 0 0 0 1px rgba(160, 120, 255, 0.22);
        }

        .phone-shell::after {
            right: -3px;
            top: 112px;
            height: 54px;
        }

        html[data-theme="light"] .phone-shell {
            background: linear-gradient(160deg, #efe7ff, #ffffff 62%, #f3ecff 100%);
            border-color: rgba(124, 58, 237, 0.35);
            box-shadow:
                0 26px 60px rgba(87, 42, 160, 0.22),
                0 0 36px rgba(124, 58, 237, 0.16),
                inset 0 1px 0 rgba(255, 255, 255, 0.9),
                inset 0 -1px 0 rgba(87, 42, 160, 0.12);
        }

        html[data-theme="light"] .phone-shell::before,
        html[data-theme="light"] .phone-shell::after {
            background: linear-gradient(180deg, #d9cdf6, #c3b2ee);
            box-shadow: inset 0 0 0 1px rgba(124, 58, 237, 0.2);
        }

        /* «Островок» камеры */
        .phone-notch {
            flex: 0 0 auto;
            width: 64px;
            height: 18px;
            border-radius: 999px;
            background: #07050d;
            box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.07);
        }

        .phone-screen {
            position: relative;
            display: flex;
            flex-direction: column;
            min-height: 470px;
            border-radius: 36px;
            overflow: hidden;
            background: radial-gradient(circle at 50% 0%, #2c1c4a, #0c0914 72%);
            color: #ece6ff;
            font-family: var(--mono);
            box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.06);
        }

        html[data-theme="light"] .phone-screen {
            background: radial-gradient(circle at 50% 0%, #e7dcff, #fbf9ff 72%);
            color: #2a1b46;
        }

        html[data-theme="light"] .phone-status,
        html[data-theme="light"] .call-action-label,
        html[data-theme="light"] .call-sub:not(.is-live) {
            color: rgba(76, 42, 143, 0.68);
        }

        /* Строка состояния: время, островок, сеть и батарея */
        .phone-status {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            padding: 11px 14px 0;
            font-size: 0.56rem;
            letter-spacing: 1px;
            color: rgba(200, 180, 255, 0.62);
        }

        .ps-time { flex: 0 0 auto; font-variant-numeric: tabular-nums; }

        .ps-right {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            flex: 0 0 auto;
        }

        .ps-net { font-size: 0.5rem; letter-spacing: 0.6px; }

        .ps-signal {
            display: inline-flex;
            align-items: flex-end;
            gap: 2px;
            height: 9px;
        }

        .ps-signal i {
            width: 2px;
            border-radius: 1px;
            background: currentColor;
        }

        .ps-signal i:nth-child(1) { height: 3px; opacity: 0.55; }
        .ps-signal i:nth-child(2) { height: 5px; opacity: 0.75; }
        .ps-signal i:nth-child(3) { height: 7px; }
        .ps-signal i:nth-child(4) { height: 9px; opacity: 0.3; }

        .ps-batt {
            position: relative;
            display: inline-block;
            width: 18px;
            height: 9px;
            border: 1px solid currentColor;
            border-radius: 2px;
            opacity: 0.85;
        }

        .ps-batt::after {
            content: "";
            position: absolute;
            right: -3px;
            top: 2px;
            width: 2px;
            height: 3px;
            border-radius: 0 1px 1px 0;
            background: currentColor;
        }

        .ps-batt i {
            position: absolute;
            top: 1px;
            left: 1px;
            bottom: 1px;
            width: 87%;
            border-radius: 1px;
            background: currentColor;
        }

        .ps-batt-num {
            font-size: 0.5rem;
            letter-spacing: 0.3px;
            font-variant-numeric: tabular-nums;
        }

        .phone-body {
            position: relative;
            flex: 1 1 auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding: 10px 16px 18px;
        }

        .call-top {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            padding-top: 14px;
            text-align: center;
        }

        .call-avatar {
            display: grid;
            place-items: center;
            width: 56px;
            height: 56px;
            border-radius: 50%;
            font-size: 1rem;
            letter-spacing: 1px;
            color: #ffd97a;
            background: rgba(255, 217, 122, 0.12);
            border: 1px solid rgba(255, 217, 122, 0.45);
            box-shadow: 0 0 26px rgba(255, 217, 122, 0.25);
        }

        .call-name { font-size: 0.86rem; font-weight: 700; }

        .call-sub {
            font-size: 0.64rem;
            letter-spacing: 1.4px;
            text-transform: uppercase;
            color: rgba(200, 180, 255, 0.55);
        }

        .call-sub.is-live { color: #6ee7a8; }

        .call-bell {
            margin: 4px 0 0;
            font-size: 2.4rem;
            line-height: 1;
            text-align: center;
            animation: bellShake 1.1s ease-in-out infinite;
            filter: drop-shadow(0 0 18px rgba(199, 125, 255, 0.55));
        }

        @keyframes bellShake {
            0%, 100% { transform: rotate(0); }
            15% { transform: rotate(-16deg); }
            30% { transform: rotate(14deg); }
            45% { transform: rotate(-10deg); }
            60% { transform: rotate(8deg); }
            75% { transform: rotate(-4deg); }
        }

        /* Кнопки вызова: слева отбой, справа ответ */
        .call-actions {
            display: flex;
            align-items: flex-start;
            justify-content: space-around;
            gap: 16px;
            margin-top: auto;
            padding: 0 4px 8px;
        }

        .call-action {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        .call-btn {
            display: grid;
            place-items: center;
            width: 62px;
            height: 62px;
            padding: 0;
            border: none;
            border-radius: 50%;
            font-size: 1.45rem;
            line-height: 1;
            cursor: pointer;
            transition: transform 0.16s ease, filter 0.16s ease, box-shadow 0.16s ease;
        }

        /* Трубка «положена» — повёрнута, как у отбоя */
        .call-btn span { display: block; transform: rotate(135deg); }

        .call-btn.is-decline {
            color: #fff;
            background: linear-gradient(160deg, #ff5d5d, #c81f1f);
            box-shadow: 0 10px 26px rgba(220, 38, 38, 0.42), inset 0 1px 0 rgba(255, 255, 255, 0.32);
        }

        .call-btn.is-accept {
            color: #05281a;
            background: linear-gradient(160deg, #6ef0a6, #18b96a);
            box-shadow: 0 10px 26px rgba(24, 185, 106, 0.42), inset 0 1px 0 rgba(255, 255, 255, 0.42);
        }

        .call-btn.is-accept span { transform: none; }

        .call-btn:hover { transform: translateY(-2px); filter: brightness(1.06); }
        .call-btn:active { transform: scale(0.96); }

        .call-btn:focus-visible {
            outline: 2px solid rgba(255, 255, 255, 0.75);
            outline-offset: 4px;
        }

        .call-action-label {
            font-size: 0.55rem;
            letter-spacing: 1.3px;
            text-transform: uppercase;
            color: rgba(200, 180, 255, 0.6);
        }

        .call-text {
            margin: 10px 0 0;
            font-size: 0.79rem;
            line-height: 1.6;
            min-height: 5em;
        }

        .call-wave {
            display: flex;
            align-items: flex-end;
            justify-content: center;
            gap: 4px;
            height: 26px;
            margin-top: auto;
        }

        .call-wave i {
            width: 3px;
            height: 22px;
            border-radius: 2px;
            background: #6ee7a8;
            transform-origin: bottom;
            animation: wave 0.9s ease-in-out infinite;
        }

        .call-wave i:nth-child(1) { animation-delay: 0s; }
        .call-wave i:nth-child(2) { animation-delay: 0.12s; }
        .call-wave i:nth-child(3) { animation-delay: 0.24s; }
        .call-wave i:nth-child(4) { animation-delay: 0.36s; }
        .call-wave i:nth-child(5) { animation-delay: 0.48s; }

        @keyframes wave {
            0%, 100% { transform: scaleY(0.3); opacity: 0.45; }
            50% { transform: scaleY(1); opacity: 1; }
        }

        .done-badge {
            align-self: center;
            margin-top: 24px;
            padding: 6px 14px;
            border-radius: 999px;
            font-size: 0.68rem;
            letter-spacing: 2px;
            color: #ff9b9b;
            border: 1px solid rgba(255, 122, 122, 0.45);
            background: rgba(255, 122, 122, 0.1);
        }

        .done-badge.is-help {
            color: #7ee2b8;
            border-color: rgba(110, 231, 168, 0.45);
            background: rgba(110, 231, 168, 0.1);
        }

        .done-badge.is-missed {
            color: #ffcf8b;
            border-color: rgba(255, 190, 110, 0.45);
            background: rgba(255, 190, 110, 0.1);
        }

        .done-text {
            margin: 0;
            font-size: 0.78rem;
            line-height: 1.6;
            text-align: center;
            color: rgba(236, 230, 255, 0.8);
        }

        .done-sub {
            margin-top: auto;
            text-align: center;
            font-size: 0.62rem;
            letter-spacing: 1.4px;
            text-transform: uppercase;
            color: rgba(200, 180, 255, 0.45);
        }

        .app-tile {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 7px;
            margin: 14px auto 0;
        }

        .app-icon {
            position: relative;
            display: grid;
            place-items: center;
            width: 62px;
            height: 62px;
            border-radius: 18px;
            font-size: 1.7rem;
            background: linear-gradient(160deg, rgba(138, 43, 226, 0.45), rgba(12, 9, 20, 0.9));
            border: 1px solid rgba(199, 125, 255, 0.45);
            box-shadow: 0 0 26px rgba(138, 43, 226, 0.4);
        }

        .app-spin {
            position: absolute;
            inset: -6px;
            border-radius: 24px;
            border: 2px solid rgba(199, 125, 255, 0.22);
            border-top-color: #c77dff;
            animation: spin 1.1s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .app-name { font-size: 0.66rem; letter-spacing: 1px; }

        .app-state { font-size: 0.6rem; color: rgba(200, 180, 255, 0.55); }

        /* ===== Телефон после звонка: рабочий стол и приложения ===== */
        /* Слой поверх тела телефона: мысли снизу, уведомления сверху */
        .phone-layer {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            gap: 8px;
            padding: 40px 12px 0;
            pointer-events: none;
        }

        .th-who { color: #c77dff; font-weight: 700; }

        /* Пуш сверху, как в iOS */
        .phone-notify {
            display: flex;
            align-items: flex-start;
            gap: 9px;
            padding: 9px 11px;
            border-radius: 18px;
            background: rgba(28, 20, 46, 0.94);
            border: 1px solid rgba(199, 125, 255, 0.28);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(10px);
            opacity: 0;
            transform: translateY(-14px) scale(0.98);
            transition: opacity 0.32s ease, transform 0.32s cubic-bezier(0.2, 0.9, 0.3, 1.2);
        }

        .phone-notify.is-in { opacity: 1; transform: translateY(0) scale(1); }

        .pn-ico {
            display: grid;
            place-items: center;
            flex: 0 0 auto;
            width: 30px;
            height: 30px;
            border-radius: 9px;
            font-size: 0.95rem;
            background: linear-gradient(160deg, rgba(255, 190, 110, 0.35), rgba(255, 140, 40, 0.22));
            border: 1px solid rgba(255, 190, 110, 0.4);
        }

        .pn-body {
            display: flex;
            flex-direction: column;
            min-width: 0;
        }

        .pn-app {
            display: block;
            margin-bottom: 1px;
            font-size: 0.54rem;
            letter-spacing: 1.2px;
            text-transform: uppercase;
            color: rgba(200, 180, 255, 0.55);
        }

        .pn-text { font-size: 0.62rem; line-height: 1.45; }

        /* Пицца приезжает под телефоном и висит до сброса */
        .phone-pizza {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            width: 100%;
            max-width: 300px;
            margin-left: auto;
            padding: 10px 0 4px;
            animation: pizzaIn 0.75s cubic-bezier(0.2, 0.9, 0.3, 1.15) both;
        }

        @keyframes pizzaIn {
            from { opacity: 0; transform: translateY(46px); }
            to   { opacity: 1; transform: none; }
        }

        /* Круг: свечение, тень и покачивание */
        .pizza-disc {
            position: relative;
            display: grid;
            place-items: center;
            width: 140px;
            height: 140px;
            border-radius: 50%;
            font-size: 96px;
            line-height: 1;
            background:
                radial-gradient(circle at 50% 38%, rgba(255, 205, 120, 0.28), rgba(28, 15, 6, 0.92) 68%);
            border: 2px solid rgba(255, 190, 110, 0.5);
            box-shadow:
                0 0 46px rgba(255, 170, 60, 0.35),
                0 20px 44px rgba(0, 0, 0, 0.55),
                inset 0 0 34px rgba(255, 190, 110, 0.16);
            animation: pizzaWobble 3.4s ease-in-out infinite;
        }

        .pizza-disc::after {
            content: "";
            position: absolute;
            inset: -14px;
            border-radius: 50%;
            border: 1px solid rgba(255, 190, 110, 0.18);
            animation: pizzaPulse 2.6s ease-in-out infinite;
        }

        @keyframes pizzaWobble {
            0%, 100% { transform: rotate(-4deg) scale(1); }
            50%      { transform: rotate(4deg) scale(1.03); }
        }

        @keyframes pizzaPulse {
            0%, 100% { opacity: 0.25; transform: scale(0.96); }
            50%      { opacity: 0.7;  transform: scale(1.04); }
        }

        .pizza-caption {
            margin: 2px 0 0;
            font-family: var(--mono);
            font-size: 0.62rem;
            letter-spacing: 0.4px;
            text-align: center;
            color: #ffd8a3;
        }

        .pz-ico { font-size: 1.3rem; }

        /* Рабочий стол */
        .home-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 2px;
            font-size: 0.55rem;
            letter-spacing: 1.4px;
            text-transform: uppercase;
            color: rgba(200, 180, 255, 0.5);
        }

        .home-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 4px;
        }

        .home-app {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 7px;
            padding: 12px 6px;
            border-radius: 16px;
            border: 1px solid rgba(199, 125, 255, 0.2);
            background: rgba(255, 255, 255, 0.04);
            color: inherit;
            font-family: var(--mono);
            font-size: 0.58rem;
            cursor: pointer;
            transition: transform 0.18s ease, background 0.18s ease, border-color 0.18s ease;
        }

        .home-app:hover,
        .home-app:focus-visible {
            transform: translateY(-2px);
            border-color: rgba(199, 125, 255, 0.5);
            background: rgba(199, 125, 255, 0.12);
            outline: none;
        }

        .home-ico {
            display: grid;
            place-items: center;
            width: 46px;
            height: 46px;
            border-radius: 14px;
            font-size: 1.25rem;
            background: linear-gradient(160deg, rgba(138, 43, 226, 0.35), rgba(12, 9, 20, 0.85));
            border: 1px solid rgba(199, 125, 255, 0.35);
        }

        .home-name { line-height: 1.25; text-align: center; }

        /* Шапка приложения */
        .app-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            padding-top: 4px;
            font-size: 0.64rem;
            letter-spacing: 1.1px;
            text-transform: uppercase;
            color: rgba(200, 180, 255, 0.7);
        }

        .app-title { font-weight: 700; }

        .app-net {
            padding: 2px 8px;
            border-radius: 999px;
            border: 1px solid rgba(255, 122, 122, 0.4);
            color: #ffb3b3;
            font-size: 0.54rem;
            letter-spacing: 0.8px;
        }

        .app-net.is-on {
            border-color: rgba(110, 231, 168, 0.45);
            color: #7ee2b8;
        }

        .app-body {
            flex: 1 1 auto;
            min-height: 0;
            display: flex;
            flex-direction: column;
            gap: 7px;
        }

        /* Кнопка «закрыть приложение» — выход на рабочий стол */
        .app-home {
            flex: 0 0 auto;
            align-self: center;
            width: 62px;
            height: 26px;
            margin-top: auto;
            padding: 0;
            border-radius: 999px;
            border: 1px solid rgba(199, 125, 255, 0.35);
            background: rgba(255, 255, 255, 0.05);
            color: #e9e2ff;
            font-family: var(--mono);
            font-size: 0.72rem;
            line-height: 1;
            cursor: pointer;
            transition: background 0.18s ease, border-color 0.18s ease;
        }

        .app-home:hover,
        .app-home:focus-visible {
            background: rgba(199, 125, 255, 0.18);
            border-color: rgba(199, 125, 255, 0.6);
            outline: none;
        }

        /* Настройки */
        .set-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            padding: 10px 12px;
            border-radius: 14px;
            border: 1px solid rgba(199, 125, 255, 0.2);
            background: rgba(255, 255, 255, 0.04);
            font-size: 0.66rem;
        }

        .switch {
            position: relative;
            flex: 0 0 auto;
            width: 44px;
            height: 24px;
            padding: 0;
            border-radius: 999px;
            border: 1px solid rgba(199, 125, 255, 0.35);
            background: rgba(255, 255, 255, 0.08);
            cursor: pointer;
            transition: background 0.2s ease, border-color 0.2s ease;
        }

        .switch i {
            position: absolute;
            top: 2px;
            left: 2px;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: #cfc6ee;
            transition: transform 0.2s ease, background 0.2s ease;
        }

        .switch.is-on {
            background: rgba(110, 231, 168, 0.28);
            border-color: rgba(110, 231, 168, 0.55);
        }

        .switch.is-on i { transform: translateX(20px); background: #6ee7a8; }

        .set-hint {
            margin: -2px 0 0;
            padding-left: 2px;
            font-size: 0.56rem;
            color: rgba(200, 180, 255, 0.5);
        }

        .set-title {
            margin-top: 2px;
            font-size: 0.54rem;
            letter-spacing: 1.6px;
            text-transform: uppercase;
            color: rgba(200, 180, 255, 0.45);
        }

        .set-wifi {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            padding: 9px 12px;
            border-radius: 12px;
            border: 1px solid rgba(199, 125, 255, 0.16);
            background: rgba(255, 255, 255, 0.03);
            color: inherit;
            font-family: var(--mono);
            font-size: 0.62rem;
            text-align: left;
            cursor: pointer;
            transition: background 0.18s ease, border-color 0.18s ease;
        }

        .set-wifi:hover,
        .set-wifi:focus-visible {
            border-color: rgba(199, 125, 255, 0.45);
            background: rgba(199, 125, 255, 0.1);
            outline: none;
        }

        .set-lock { font-size: 0.58rem; opacity: 0.55; }

        .set-note {
            margin: 0;
            padding: 8px 12px;
            border-radius: 12px;
            border: 1px dashed rgba(255, 190, 110, 0.45);
            background: rgba(255, 190, 110, 0.08);
            color: #ffcf8b;
            font-size: 0.6rem;
        }

        /* «Нет интернета» */
        .net-off {
            flex: 1 1 auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 7px;
            text-align: center;
            font-size: 0.62rem;
            line-height: 1.5;
            color: rgba(200, 180, 255, 0.6);
        }

        .net-ico { font-size: 1.9rem; opacity: 0.8; }
        .net-off b { font-size: 0.76rem; color: #ece6ff; }

        .net-off button {
            margin-top: 4px;
            padding: 7px 14px;
            border-radius: 999px;
            border: 1px solid rgba(199, 125, 255, 0.4);
            background: rgba(199, 125, 255, 0.12);
            color: #e9e2ff;
            font-family: var(--mono);
            font-size: 0.58rem;
            cursor: pointer;
        }

        /* Браузер */
        .browse-sug { display: flex; flex-direction: column; gap: 6px; }

        .sug {
            padding: 9px 12px;
            border-radius: 12px;
            border: 1px solid rgba(199, 125, 255, 0.18);
            background: rgba(255, 255, 255, 0.03);
            color: inherit;
            font-family: var(--mono);
            font-size: 0.61rem;
            text-align: left;
            cursor: pointer;
        }

        .sug:hover,
        .sug:focus-visible {
            border-color: rgba(199, 125, 255, 0.5);
            background: rgba(199, 125, 255, 0.1);
            outline: none;
        }

        .browse-empty {
            flex: 1 1 auto;
            display: grid;
            place-items: center;
            font-size: 0.58rem;
            color: rgba(200, 180, 255, 0.35);
        }

        .app-note {
            margin: 0;
            padding: 8px 12px;
            border-radius: 12px;
            border: 1px dashed rgba(255, 190, 110, 0.35);
            background: rgba(255, 190, 110, 0.08);
            color: #ffcf8b;
            font-size: 0.6rem;
            line-height: 1.45;
        }

        /* Мессенджер: список чатов */
        .chat-row {
            display: flex;
            align-items: center;
            gap: 10px;
            width: 100%;
            padding: 9px 10px;
            border-radius: 14px;
            border: 1px solid rgba(199, 125, 255, 0.18);
            background: rgba(255, 255, 255, 0.03);
            color: inherit;
            font-family: var(--mono);
            text-align: left;
            cursor: pointer;
            transition: background 0.18s ease, border-color 0.18s ease;
        }

        .chat-row:hover,
        .chat-row:focus-visible {
            border-color: rgba(199, 125, 255, 0.45);
            background: rgba(199, 125, 255, 0.08);
            outline: none;
        }

        .chat-ava {
            display: grid;
            place-items: center;
            flex: 0 0 auto;
            width: 34px;
            height: 34px;
            border-radius: 50%;
            font-size: 0.66rem;
            color: #ffd97a;
            background: rgba(255, 217, 122, 0.12);
            border: 1px solid rgba(255, 217, 122, 0.35);
        }

        .chat-meta {
            display: flex;
            flex-direction: column;
            min-width: 0;
        }

        .chat-name { display: block; font-size: 0.64rem; font-weight: 700; }

        .chat-last {
            display: block;
            overflow: hidden;
            font-size: 0.56rem;
            white-space: nowrap;
            text-overflow: ellipsis;
            color: rgba(200, 180, 255, 0.5);
        }

        /* Мессенджер: переписка */
        .chat-head {
            display: flex;
            align-items: center;
            gap: 8px;
            padding-bottom: 4px;
            font-size: 0.64rem;
            font-weight: 700;
        }

        .chat-back {
            flex: 0 0 auto;
            width: 26px;
            height: 26px;
            padding: 0;
            border-radius: 50%;
            border: 1px solid rgba(199, 125, 255, 0.3);
            background: rgba(255, 255, 255, 0.05);
            color: #e9e2ff;
            font-family: var(--mono);
            font-size: 0.9rem;
            line-height: 1;
            cursor: pointer;
        }

        .chat-back:hover,
        .chat-back:focus-visible {
            border-color: rgba(199, 125, 255, 0.6);
            outline: none;
        }

        .chat-log {
            flex: 1 1 auto;
            min-height: 0;
            max-height: 250px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            overflow-y: auto;
            padding-right: 2px;
        }

        .msg {
            max-width: 84%;
            padding: 7px 10px;
            border-radius: 12px;
            font-size: 0.61rem;
            line-height: 1.5;
            overflow-wrap: anywhere;
        }

        .msg.is-me {
            align-self: flex-end;
            border-bottom-right-radius: 4px;
            background: rgba(110, 231, 168, 0.16);
            border: 1px solid rgba(110, 231, 168, 0.3);
        }

        .msg.is-them {
            align-self: flex-start;
            border-bottom-left-radius: 4px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(199, 125, 255, 0.2);
        }

        .msg.is-sys {
            align-self: center;
            font-size: 0.54rem;
            letter-spacing: 0.6px;
            color: rgba(200, 180, 255, 0.45);
        }

        .chat-typing { font-size: 0.55rem; color: rgba(200, 180, 255, 0.5); padding-left: 4px; }

        .chat-form { display: flex; gap: 6px; margin-top: auto; }

        .chat-input {
            flex: 1 1 auto;
            min-width: 0;
            padding: 8px 11px;
            border-radius: 999px;
            border: 1px solid rgba(199, 125, 255, 0.3);
            background: rgba(0, 0, 0, 0.25);
            color: #ece6ff;
            font-family: var(--mono);
            font-size: 0.6rem;
        }

        .chat-input:focus {
            outline: none;
            border-color: rgba(199, 125, 255, 0.6);
        }

        .chat-send {
            flex: 0 0 auto;
            width: 32px;
            height: 32px;
            padding: 0;
            border-radius: 50%;
            border: 1px solid rgba(110, 231, 168, 0.45);
            background: rgba(110, 231, 168, 0.14);
            color: #b8ffd8;
            font-size: 0.8rem;
            cursor: pointer;
        }

        /* Быстрые ответы над строкой ввода */
        .chat-quick {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .chat-chip {
            padding: 7px 11px;
            border-radius: 999px;
            border: 1px solid rgba(199, 125, 255, 0.35);
            background: rgba(199, 125, 255, 0.12);
            color: #e8dfff;
            font-family: var(--mono);
            font-size: 0.56rem;
            line-height: 1.35;
            text-align: left;
            cursor: pointer;
            transition: background 0.18s ease, border-color 0.18s ease;
        }

        .chat-chip:hover,
        .chat-chip:focus-visible {
            border-color: rgba(199, 125, 255, 0.7);
            background: rgba(199, 125, 255, 0.22);
            outline: none;
        }

        .chat-blocked {
            margin-top: auto;
            padding: 8px;
            text-align: center;
            font-size: 0.54rem;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: rgba(255, 122, 122, 0.7);
        }

        /* Скачать приложения */
        .store-app {
            display: flex;
            align-items: center;
            gap: 10px;
            width: 100%;
            padding: 10px;
            border-radius: 14px;
            border: 1px solid rgba(199, 125, 255, 0.2);
            background: rgba(255, 255, 255, 0.03);
            color: inherit;
            font-family: var(--mono);
            font-size: 0.6rem;
            line-height: 1.4;
            text-align: left;
            cursor: pointer;
        }

        .store-app:hover,
        .store-app:focus-visible {
            border-color: rgba(199, 125, 255, 0.5);
            background: rgba(199, 125, 255, 0.1);
            outline: none;
        }

        .store-sub { font-size: 0.54rem; color: rgba(200, 180, 255, 0.5); }

        /* Погода на рабочем столе */
        .home-weather {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 13px;
            border-radius: 18px;
            border: 1px solid rgba(120, 170, 255, 0.25);
            background: linear-gradient(160deg, rgba(60, 90, 160, 0.35), rgba(18, 22, 40, 0.75));
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.08);
        }

        .hw-ico { font-size: 1.5rem; line-height: 1; }
        .hw-temp { font-size: 1.05rem; font-weight: 700; letter-spacing: 0.5px; }
        .hw-city {
            margin-left: auto;
            font-size: 0.55rem;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: rgba(200, 210, 255, 0.55);
        }

        /* Яркость */
        .set-range {
            -webkit-appearance: none;
            appearance: none;
            width: 96px;
            height: 4px;
            border-radius: 999px;
            background: rgba(199, 125, 255, 0.28);
            outline: none;
            cursor: pointer;
        }

        .set-range::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 15px;
            height: 15px;
            border-radius: 50%;
            background: #e9e2ff;
            box-shadow: 0 0 10px rgba(199, 125, 255, 0.6);
        }

        .set-range::-moz-range-thumb {
            width: 15px;
            height: 15px;
            border: none;
            border-radius: 50%;
            background: #e9e2ff;
        }

        /* Логотип-секрет в настройках */
        .set-logo {
            align-self: center;
            margin-top: auto;
            width: 38px;
            height: 38px;
            padding: 0;
            border-radius: 50%;
            border: 1px solid rgba(199, 125, 255, 0.22);
            background: rgba(255, 255, 255, 0.04);
            font-size: 1.15rem;
            line-height: 1;
            cursor: pointer;
            opacity: 0.75;
            transition: opacity 0.2s ease, transform 0.2s ease, box-shadow 0.2s ease;
        }

        .set-logo:hover,
        .set-logo:focus-visible {
            opacity: 1;
            transform: scale(1.06);
            outline: none;
        }

        .set-logo.is-hot {
            opacity: 1;
            box-shadow: 0 0 22px rgba(255, 190, 110, 0.45);
        }

        /* Браузер: строка и результат */
        .browse-bar { display: flex; gap: 6px; }

        .browse-field {
            flex: 1 1 auto;
            min-width: 0;
            padding: 9px 12px;
            border-radius: 999px;
            border: 1px solid rgba(199, 125, 255, 0.3);
            background: rgba(0, 0, 0, 0.25);
            color: #ece6ff;
            font-family: var(--mono);
            font-size: 0.62rem;
        }

        .browse-field:focus {
            outline: none;
            border-color: rgba(199, 125, 255, 0.6);
        }

        .browse-go {
            flex: 0 0 auto;
            width: 32px;
            height: 32px;
            padding: 0;
            border-radius: 50%;
            border: 1px solid rgba(199, 125, 255, 0.35);
            background: rgba(199, 125, 255, 0.14);
            color: #e9e2ff;
            font-size: 0.7rem;
            cursor: pointer;
        }

        .browse-result {
            display: flex;
            flex-direction: column;
            gap: 3px;
            padding: 10px 12px;
            border-radius: 14px;
            border: 1px solid rgba(199, 125, 255, 0.22);
            background: rgba(255, 255, 255, 0.04);
        }

        .br-title { font-size: 0.66rem; font-weight: 700; }
        .br-text { font-size: 0.58rem; line-height: 1.45; color: rgba(200, 180, 255, 0.62); }

        .browse-result.is-agent {
            border-color: rgba(255, 122, 122, 0.4);
            background: rgba(255, 122, 122, 0.08);
        }

        .browse-result.is-agent .br-title { color: #ffb3b3; }

        /* «прочитано» в чате с 45 */
        .msg.is-read {
            align-self: flex-end;
            font-size: 0.54rem;
            letter-spacing: 0.4px;
            color: #6ee7a8;
        }

        /* Заметки 45: панель по свайпу на рабочем столе */
        .home-notes {
            position: absolute;
            inset: 0;
            z-index: 5;
            display: flex;
            flex-direction: column;
            gap: 8px;
            padding: 14px 16px;
            border-radius: 18px;
            background: linear-gradient(160deg, rgba(46, 28, 12, 0.97), rgba(16, 11, 6, 0.98));
            border: 1px solid rgba(255, 190, 110, 0.35);
            box-shadow: inset 0 0 40px rgba(255, 170, 60, 0.08);
            animation: notesIn 0.35s ease both;
        }

        @keyframes notesIn {
            from { opacity: 0; transform: translateX(-18px); }
            to   { opacity: 1; transform: none; }
        }

        .notes-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 0.56rem;
            letter-spacing: 1.6px;
            text-transform: uppercase;
            color: #ffcf8b;
        }

        .notes-close {
            width: 24px;
            height: 24px;
            padding: 0;
            border-radius: 50%;
            border: 1px solid rgba(255, 190, 110, 0.35);
            background: rgba(255, 190, 110, 0.1);
            color: #ffcf8b;
            font-size: 0.8rem;
            line-height: 1;
            cursor: pointer;
        }

        .notes-list {
            display: flex;
            flex-direction: column;
            gap: 7px;
            margin: 0;
            padding: 0;
            list-style: none;
            font-size: 0.6rem;
            line-height: 1.5;
            color: rgba(255, 230, 200, 0.85);
        }

        .notes-list li {
            padding-left: 12px;
            position: relative;
        }

        .notes-list li::before {
            content: "—";
            position: absolute;
            left: 0;
            color: rgba(255, 190, 110, 0.55);
        }

        .notes-foot {
            margin-top: auto;
            font-size: 0.54rem;
            color: rgba(255, 200, 140, 0.45);
        }

        /* Светлая тема */
        html[data-theme="light"] .home-app,
        html[data-theme="light"] .set-row,
        html[data-theme="light"] .set-wifi,
        html[data-theme="light"] .sug,
        html[data-theme="light"] .chat-row,
        html[data-theme="light"] .store-app {
            background: rgba(255, 255, 255, 0.72);
            border-color: rgba(124, 58, 237, 0.2);
            color: #2a1b46;
        }

        html[data-theme="light"] .home-ico {
            background: linear-gradient(160deg, rgba(124, 58, 237, 0.14), rgba(255, 255, 255, 0.92));
            border-color: rgba(124, 58, 237, 0.25);
        }

        html[data-theme="light"] .app-home,
        html[data-theme="light"] .chat-back {
            color: #2a1b46;
            background: rgba(255, 255, 255, 0.85);
            border-color: rgba(124, 58, 237, 0.25);
        }

        html[data-theme="light"] .switch { background: rgba(42, 27, 70, 0.12); }

        html[data-theme="light"] .switch.is-on { background: rgba(16, 150, 90, 0.22); }

        html[data-theme="light"] .chat-input {
            background: #fff;
            color: #2a1b46;
            border-color: rgba(124, 58, 237, 0.3);
        }

        html[data-theme="light"] .chat-chip {
            color: #4c2a8f;
            background: rgba(124, 58, 237, 0.1);
            border-color: rgba(124, 58, 237, 0.28);
        }

        html[data-theme="light"] .msg.is-them {
            background: rgba(124, 58, 237, 0.09);
            border-color: rgba(124, 58, 237, 0.2);
        }

        html[data-theme="light"] .msg.is-me {
            background: rgba(16, 150, 90, 0.13);
            border-color: rgba(16, 150, 90, 0.28);
        }

        html[data-theme="light"] .phone-notify {
            background: #fff;
            color: #2a1b46;
        }

        html[data-theme="light"] .pizza-disc {
            background: radial-gradient(circle at 50% 38%, rgba(255, 205, 120, 0.6), #ffe6c0 68%);
            border-color: rgba(200, 120, 30, 0.45);
            box-shadow: 0 18px 36px rgba(87, 42, 160, 0.18), 0 0 40px rgba(255, 170, 60, 0.28);
        }

        html[data-theme="light"] .pizza-caption { color: #7a4a12; }

        html[data-theme="light"] .net-off { color: rgba(42, 27, 70, 0.6); }
        html[data-theme="light"] .net-off b { color: #2a1b46; }

        html[data-theme="light"] .home-weather {
            background: linear-gradient(160deg, rgba(120, 170, 255, 0.28), rgba(255, 255, 255, 0.92));
            border-color: rgba(124, 58, 237, 0.2);
        }

        html[data-theme="light"] .hw-city { color: rgba(42, 27, 70, 0.5); }

        html[data-theme="light"] .browse-field {
            background: #fff;
            color: #2a1b46;
            border-color: rgba(124, 58, 237, 0.3);
        }

        html[data-theme="light"] .browse-result {
            background: rgba(124, 58, 237, 0.06);
            border-color: rgba(124, 58, 237, 0.2);
        }

        html[data-theme="light"] .br-text { color: rgba(42, 27, 70, 0.65); }

        html[data-theme="light"] .set-logo {
            background: rgba(255, 255, 255, 0.75);
            border-color: rgba(124, 58, 237, 0.2);
        }

        html[data-theme="light"] .msg.is-read { color: #0f8a5f; }

        html[data-theme="light"] .home-notes {
            background: linear-gradient(160deg, #fff6e8, #ffe9cc);
            border-color: rgba(200, 120, 30, 0.35);
        }

        html[data-theme="light"] .notes-head { color: #7a4a12; }

        html[data-theme="light"] .notes-list { color: #5a3a18; }
        html[data-theme="light"] .notes-foot { color: rgba(90, 58, 24, 0.55); }

        /* Вспышка терминала при достижении */
        .term.is-flash { animation: termFlash 0.6s ease; }

        @keyframes termFlash {
            0%   { box-shadow: 0 0 0 rgba(199, 125, 255, 0); }
            35%  { box-shadow: 0 0 90px rgba(199, 125, 255, 0.55), 0 24px 70px rgba(0, 0, 0, 0.55); }
            100% { box-shadow: 0 24px 70px rgba(0, 0, 0, 0.55), 0 0 46px rgba(138, 43, 226, 0.2); }
        }

        /* ===== Мысли героя и комната ===== */
        /* Субтитры внизу экрана: живут поверх страницы, не внутри телефона */
        .subtitle {
            position: fixed;
            left: 50%;
            bottom: 76px;
            z-index: 60;
            max-width: min(680px, calc(100% - 40px));
            padding: 10px 18px;
            border-radius: 14px;
            font-family: var(--mono);
            font-size: 0.78rem;
            line-height: 1.5;
            text-align: center;
            color: #efe8ff;
            background: rgba(12, 9, 20, 0.88);
            border: 1px solid rgba(199, 125, 255, 0.35);
            box-shadow: 0 18px 44px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            opacity: 0;
            pointer-events: none;
            transform: translate(-50%, 14px);
            transition: opacity 0.3s ease, transform 0.3s ease;
        }

        .subtitle.is-in { opacity: 1; transform: translate(-50%, 0); }

        .subtitle .th-who { color: #c77dff; font-weight: 700; }

        html[data-theme="light"] .subtitle {
            background: rgba(255, 255, 255, 0.94);
            color: #2a1b46;
            border-color: rgba(124, 58, 237, 0.25);
            box-shadow: 0 14px 34px rgba(87, 42, 160, 0.18);
        }

        /* Кнопки комнаты */
        .room-bar {
            position: fixed;
            left: 18px;
            bottom: 18px;
            z-index: 900;
            display: flex;
            gap: 8px;
        }

        .room-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 9px 14px;
            border-radius: 999px;
            font-family: var(--mono);
            font-size: 0.7rem;
            color: #e9e2ff;
            background: rgba(26, 21, 40, 0.9);
            border: 1px solid rgba(138, 43, 226, 0.4);
            backdrop-filter: blur(10px);
