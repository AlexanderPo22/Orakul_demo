            -webkit-backdrop-filter: blur(10px);
            box-shadow: 0 0 18px rgba(138, 43, 226, 0.22);
            cursor: pointer;
            transition: border-color 0.22s ease, transform 0.18s ease, box-shadow 0.22s ease;
        }

        .room-btn:hover,
        .room-btn:focus-visible {
            border-color: rgba(199, 125, 255, 0.75);
            transform: translateY(-1px);
            box-shadow: 0 0 26px rgba(199, 125, 255, 0.35);
            outline: none;
        }

        html[data-theme="light"] .room-btn {
            color: #2a1b46;
            background: rgba(255, 255, 255, 0.92);
            border-color: rgba(124, 58, 237, 0.28);
            box-shadow: 0 6px 18px rgba(87, 42, 160, 0.12);
        }

        /* Кнопки комнаты появляются по мере осмотра */
        .room-btn[hidden] { display: none; }

        /* ===== orakul.app: список агентов ===== */
        .ag-head {
            display: flex;
            justify-content: space-between;
            gap: 8px;
            font-size: 0.52rem;
            letter-spacing: 0.8px;
            text-transform: uppercase;
            color: rgba(200, 180, 255, 0.5);
        }

        .ag-list {
            display: flex;
            flex-direction: column;
            gap: 4px;
            max-height: 322px;
            overflow-y: auto;
            padding-right: 2px;
        }

        .ag-row {
            display: flex;
            align-items: center;
            gap: 8px;
            width: 100%;
            padding: 6px 9px;
            border-radius: 10px;
            text-align: left;
            font-family: var(--mono);
            font-size: 0.6rem;
            color: #e9e2ff;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(199, 125, 255, 0.18);
            cursor: pointer;
            transition: border-color 0.18s ease, background 0.18s ease;
        }

        .ag-row:hover,
        .ag-row:focus-visible {
            border-color: rgba(199, 125, 255, 0.55);
            background: rgba(199, 125, 255, 0.12);
            outline: none;
        }

        .ag-dot {
            flex: 0 0 auto;
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #6ee7a8;
            box-shadow: 0 0 8px rgba(110, 231, 168, 0.85);
        }

        .ag-row.is-off .ag-dot { background: #77778a; box-shadow: none; }
        .ag-row.is-boss .ag-dot { background: #c77dff; box-shadow: 0 0 8px rgba(199, 125, 255, 0.85); }
        .ag-row.is-me .ag-dot { background: #ffd166; box-shadow: 0 0 8px rgba(255, 209, 102, 0.85); }

        .ag-num { font-weight: 700; letter-spacing: 0.6px; }

        .ag-role {
            margin-left: auto;
            font-size: 0.52rem;
            color: rgba(200, 180, 255, 0.55);
            white-space: nowrap;
        }

        .ag-row.is-off .ag-role { color: rgba(200, 180, 255, 0.4); }

        /* Карточка агента */
        .ag-card {
            display: flex;
            flex-direction: column;
            gap: 5px;
            padding: 12px;
            border-radius: 14px;
            background: rgba(199, 125, 255, 0.08);
            border: 1px solid rgba(199, 125, 255, 0.3);
        }

        .ag-title { font-size: 0.72rem; font-weight: 700; color: #e9e2ff; }
        .ag-status { font-size: 0.58rem; color: #c9b8f5; }
        .ag-note { font-size: 0.54rem; line-height: 1.45; color: rgba(200, 180, 255, 0.55); }

        .ag-back {
            align-self: flex-start;
            padding: 6px 12px;
            border-radius: 999px;
            font-family: var(--mono);
            font-size: 0.56rem;
            color: #e9e2ff;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(199, 125, 255, 0.3);
            cursor: pointer;
        }

        .ag-back:hover,
        .ag-back:focus-visible { border-color: rgba(199, 125, 255, 0.7); outline: none; }

        /* Загрузка orakul.app */
        .ora-load {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 52px 0 44px;
        }

        .ora-ico { font-size: 2rem; animation: oraSpin 2.6s linear infinite; }

        @keyframes oraSpin {
            0%, 100% { transform: rotate(-6deg) scale(1); }
            50%      { transform: rotate(6deg) scale(1.08); }
        }

        .ora-name {
            font-family: var(--mono);
            font-size: 0.66rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #e9e2ff;
        }

        .ora-bar {
            display: block;
            width: 68%;
            height: 4px;
            border-radius: 3px;
            overflow: hidden;
            background: rgba(255, 255, 255, 0.1);
        }

        .ora-bar i {
            display: block;
            height: 100%;
            border-radius: 3px;
            background: linear-gradient(90deg, #8a2be2, #c77dff);
            transform-origin: left;
            animation: oraFill 1.5s ease-out both;
        }

        @keyframes oraFill {
            from { transform: scaleX(0.04); }
            to   { transform: scaleX(1); }
        }

        .ora-hint { font-size: 0.52rem; color: rgba(200, 180, 255, 0.5); }

        /* ===== EasyHacking: мини-игра «Саймон» ===== */
        .hack-modal {
            position: fixed;
            inset: 0;
            z-index: 1200;
            display: grid;
            place-items: center;
            padding: 16px;
            background: rgba(6, 4, 12, 0.74);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
        }

        .hack-modal[hidden] { display: none; }

        body.is-hack { overflow: hidden; }

        .hack-win {
            width: min(360px, 100%);
            padding: 16px 16px 14px;
            border-radius: 22px;
            background: linear-gradient(165deg, #1d1630, #0e0a18 72%);
            border: 1px solid rgba(160, 120, 255, 0.35);
            box-shadow: 0 30px 70px rgba(0, 0, 0, 0.7), 0 0 46px rgba(138, 43, 226, 0.25);
            animation: hackIn 0.28s cubic-bezier(0.2, 0.8, 0.2, 1) both;
        }

        @keyframes hackIn {
            from { opacity: 0; transform: translateY(14px) scale(0.97); }
            to   { opacity: 1; transform: none; }
        }

        .hack-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
        }

        .hack-title {
            font-family: var(--mono);
            font-size: 0.7rem;
            letter-spacing: 1.4px;
            text-transform: uppercase;
            color: #c77dff;
        }

        .hack-close {
            display: grid;
            place-items: center;
            width: 26px;
            height: 26px;
            border-radius: 50%;
            font-size: 0.62rem;
            color: #e9e2ff;
            background: rgba(255, 255, 255, 0.07);
            border: 1px solid rgba(199, 125, 255, 0.3);
            cursor: pointer;
        }

        .hack-close:hover,
        .hack-close:focus-visible { border-color: rgba(199, 125, 255, 0.75); outline: none; }

        .hack-status {
            margin: 9px 0 11px;
            min-height: 1.15em;
            font-family: var(--mono);
            font-size: 0.58rem;
            letter-spacing: 0.3px;
            color: rgba(210, 195, 255, 0.72);
        }

        .hack-status.is-bad { color: #ff8f8f; }
        .hack-status.is-ok { color: #7ee2b8; }

        .hack-pads {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 9px;
        }

        .hack-pad {
            height: 74px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.14);
            cursor: pointer;
            filter: saturate(0.85) brightness(0.62);
            transition: filter 0.12s ease, transform 0.1s ease, box-shadow 0.18s ease;
        }

        .hack-pad.is-red    { background: radial-gradient(circle at 50% 30%, #ff8a8a, #b02020 72%); }
        .hack-pad.is-green  { background: radial-gradient(circle at 50% 30%, #8affb0, #128a46 72%); }
        .hack-pad.is-blue   { background: radial-gradient(circle at 50% 30%, #8ac4ff, #14479e 72%); }
        .hack-pad.is-yellow { background: radial-gradient(circle at 50% 30%, #ffe58a, #a97a08 72%); }

        .hack-pad.is-lit {
            filter: saturate(1.2) brightness(1.35);
            transform: scale(0.97);
            box-shadow: 0 0 26px rgba(255, 255, 255, 0.45);
        }

        .hack-pad:focus-visible { outline: 2px solid rgba(255, 255, 255, 0.7); outline-offset: 2px; }

        .hack-dots {
            display: flex;
            gap: 5px;
            justify-content: center;
            margin-top: 10px;
        }

        .hack-dots i {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: rgba(199, 125, 255, 0.25);
        }

        .hack-dots i.is-on { background: #c77dff; box-shadow: 0 0 8px rgba(199, 125, 255, 0.85); }

        /* Сцена: автомат отъезжает, за ним открывается проход */
        .hack-stage {
            position: relative;
            height: 92px;
            margin-top: 12px;
            border-radius: 12px;
            overflow: hidden;
            background: radial-gradient(circle at 50% 130%, rgba(138, 43, 226, 0.28), rgba(10, 7, 18, 0.92));
            border: 1px solid rgba(160, 120, 255, 0.2);
        }

        .hack-machine {
            position: absolute;
            left: 50%;
            bottom: 8px;
            display: grid;
            place-items: center;
            width: 62px;
            height: 74px;
            border-radius: 8px;
            font-size: 1.1rem;
            background: linear-gradient(180deg, #2a2140, #151022);
            border: 1px solid rgba(199, 125, 255, 0.35);
            box-shadow: 0 0 18px rgba(138, 43, 226, 0.25);
            transform: translateX(-50%);
            transition: transform 0.7s cubic-bezier(0.2, 0.8, 0.2, 1), opacity 0.7s ease;
        }

        .hack-machine.is-moved {
            transform: translateX(calc(-50% - 104px)) rotate(-7deg);
            opacity: 0.55;
        }

        .hack-door {
            position: absolute;
            left: 50%;
            bottom: 8px;
            display: grid;
            place-items: center;
            width: 54px;
            height: 74px;
            border-radius: 8px;
            font-size: 1.3rem;
            background: linear-gradient(180deg, #3a1f5e, #0a0612);
            border: 1px solid rgba(255, 209, 102, 0.45);
            box-shadow: inset 0 0 24px rgba(255, 209, 102, 0.18);
            transform: translateX(-50%);
            opacity: 0;
            transition: opacity 0.5s ease 0.35s;
        }

        .hack-door.is-open { opacity: 1; }

        .hack-next {
            width: 100%;
            margin-top: 12px;
            padding: 10px;
            border-radius: 12px;
            font-family: var(--mono);
            font-size: 0.62rem;
            color: #ffe9b0;
            background: rgba(255, 209, 102, 0.12);
            border: 1px solid rgba(255, 209, 102, 0.45);
            cursor: pointer;
            transition: background 0.18s ease, border-color 0.18s ease;
        }

        .hack-next:hover,
        .hack-next:focus-visible {
            background: rgba(255, 209, 102, 0.2);
            border-color: rgba(255, 209, 102, 0.8);
            outline: none;
        }

        .hack-next[hidden] { display: none; }

        /* Светлая тема: список агентов остаётся читаемым */
        html[data-theme="light"] .ag-row {
            background: rgba(255, 255, 255, 0.72);
            border-color: rgba(124, 58, 237, 0.2);
            color: #2a1b46;
        }

        html[data-theme="light"] .ag-role { color: rgba(42, 27, 70, 0.5); }

        html[data-theme="light"] .ag-card {
            background: rgba(124, 58, 237, 0.07);
            border-color: rgba(124, 58, 237, 0.22);
        }

        html[data-theme="light"] .ag-title { color: #2a1b46; }
        html[data-theme="light"] .ag-status { color: #4c2a8f; }
        html[data-theme="light"] .ag-note { color: rgba(42, 27, 70, 0.55); }

        html[data-theme="light"] .ag-back {
            color: #2a1b46;
            background: rgba(255, 255, 255, 0.85);
            border-color: rgba(124, 58, 237, 0.25);
        }

        html[data-theme="light"] .ora-name { color: #2a1b46; }
        html[data-theme="light"] .ora-bar { background: rgba(42, 27, 70, 0.12); }

        /* ===== Адаптив ===== */
        @media (max-width: 640px) {
            .stage { padding: 18px 12px 80px; }
            .term-body { padding: 14px 13px 6px; font-size: 0.79rem; min-height: 52vh; max-height: 64vh; }
            .term-input { padding: 10px 13px 13px; gap: 8px; }
            .prompt { font-size: 0.76rem; }
            .term-input input { font-size: 0.82rem; }
            .term-title { font-size: 0.66rem; }
            .term-status { display: none; }
            .hint { font-size: 0.72rem; }
            /* Кнопок в комнате стало больше: переносим их в две-три строки */
            .room-bar {
                left: 8px;
                right: 8px;
                bottom: 8px;
                flex-wrap: wrap;
                gap: 6px;
                justify-content: flex-start;
            }
            .room-btn { padding: 7px 10px; font-size: 0.62rem; }
            .subtitle { bottom: 122px; padding: 8px 14px; font-size: 0.72rem; }
            .hack-pad { height: 62px; }
            .hack-stage { height: 84px; }
            .hack-machine,
            .hack-door { height: 66px; }
        }

        /* Телефон на узком экране уезжает под консоль */
        @media (max-width: 900px) {
            .stage.has-phone { max-width: 980px; }
            .stage-row { flex-direction: column; }
            .stage-row .term,
            .stage-row.has-phone .term { flex: 1 1 auto; width: 100%; }
            .phone-col,
            .phone-col.is-in { flex: 0 0 auto; width: 100%; }
            .phone,
            .phone.is-in { flex: 0 0 auto; width: 100%; }
            .phone-shell { margin: 0 auto; }
            .phone-pizza { margin: 0 auto; }
        }

        @media (prefers-reduced-motion: reduce) {
            .stage,
            .stage-row .term { transition: none; }
            .phone.is-in,
            .call-bell,
            .call-wave i,
            .app-spin,

    <script>

</head>
<body>

    <div class="scanlines" aria-hidden="true"></div>

    <header class="topbar">

        <span class="tag">orakul://console</span>

    <main class="stage" id="stage">

            <div class="term-bar">
                <span class="dots" aria-hidden="true"><i></i><i></i><i></i></span>
                <span class="term-title">orakul@demo — secure shell — 80×24</span>
                <span class="term-status" id="termStatus">secure</span>
            </div>

            <!-- aria-live="off": строки печатаются по символу, и вежливый
                 live-регион зачитывал бы каждую букву -->
            <div class="term-body" id="out" role="log" aria-live="off"></div>

            <form class="term-input" id="form" autocomplete="off">
                <label class="prompt" id="prompt" for="cmd">orakul@demo:~$</label>
                <input id="cmd" name="cmd" type="text" autocomplete="off" autocapitalize="off"
                       autocorrect="off" spellcheck="false" placeholder="help"
                       aria-label="Команда консоли">
            </form>
        </section>

        <!-- Телефон: выезжает справа, когда босс перезванивает.
             Колонка нужна, чтобы карточка пиццы встала под телефоном,
             а не поверх экрана. -->
        <div class="phone-col" id="phoneCol">
        <aside class="phone" id="phone" aria-hidden="true" data-no-click-sound>
            <div class="phone-shell">
                <div class="phone-screen">
                    <div class="phone-status">
                        <span class="ps-time" id="phoneClock">--:--</span>
                        <span class="phone-notch" aria-hidden="true"></span>
                        <span class="ps-right">
                            <span class="ps-signal" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
                            <span class="ps-net">4G</span>
                            <span class="ps-batt" aria-hidden="true"><i></i></span>
                            <span class="ps-batt-num">87%</span>
                        </span>
                    </div>
                    <div class="phone-body" id="phoneBody"></div>
                    <!-- Мысли и уведомления поверх экрана: живут отдельно
                         от body, поэтому перерисовка приложений их не стирает -->
                    <div class="phone-layer" id="phoneLayer"></div>
                </div>
            </div>
        </aside>
            <div class="phone-under" id="phoneUnder"></div>
        </div>
        </div>

        <p class="hint">Подсказка: начни с <code>help</code>. Выход — <code>exit</code>.</p>

        <!-- Сюда попадает готовая строка целиком: скринридер читает её один
             раз, а не по букве, как из «печатающегося» лога -->
        <div class="sr-only" id="outLive" role="status" aria-live="polite" aria-atomic="true"></div>
    </main>

    <button class="sound-toggle" id="soundToggle" type="button" aria-pressed="true">
        <span class="dot" aria-hidden="true"></span>
        <span id="soundLabel">🔊 Звук вкл</span>
    </button>

    <!-- Рассудок: вертикальная шкала справа снизу. Чем ниже, тем чаще
         случаются хоррор-ивенты. Восстанавливается при выходе из консоли,
         пицце, сообщении 5045 и отдыхе вкладки. -->
    <div class="sanity" id="sanity" role="status" aria-live="polite" aria-label="Рассудок">
        <span class="sanity-emoji" id="sanityEmoji" aria-hidden="true">🧘‍♂️</span>

    <!-- Красная пелена по краям: густеет вместе с потерей рассудка -->

    <!-- Слой для хоррор-эффектов: вспышки, двери, красная комната -->
    <div class="fx-layer" id="fxLayer" aria-hidden="true"></div>

    <!-- Комната: дверь, осмотр, кулер и автомат со снеками.
         «Осмотреться» появляется после разговора с анонимом; кулер и снеки —
         после осмотра; проход — после взлома. EasyHacking ставится только
         с телефона: приложение «Скачать». -->
    <div class="room-bar" id="roomBar">
        <button class="room-btn" type="button" id="roomDoor">🚪 Дверь</button>
        <button class="room-btn" type="button" id="roomLook" hidden>👀 Осмотреться</button>
        <button class="room-btn" type="button" id="roomCooler" hidden>💧 Кулер</button>
        <button class="room-btn" type="button" id="roomSnacks" hidden>🍫 Снеки</button>
        <button class="room-btn" type="button" id="roomNext" hidden>🚪 Пройти в новую комнату</button>
    </div>

    <div class="subtitle" id="subtitle" role="status" aria-live="polite"></div>

    <!-- EasyHacking: мини-игра «Саймон». Повтори последовательность —
         автомат отъедет, и откроется проход (пока заглушка). -->
    <div class="hack-modal" id="hackModal" role="dialog" aria-modal="true"
         aria-labelledby="hackTitle" hidden>
        <div class="hack-win">
            <div class="hack-head">
                <span class="hack-title" id="hackTitle">EasyHacking</span>
                <button class="hack-close" type="button" id="hackClose" aria-label="Закрыть">✕</button>
            </div>

            <p class="hack-status" id="hackStatus">запоминай последовательность</p>

            <div class="hack-pads" id="hackPads">
                <button class="hack-pad is-red" type="button" data-pad="0" aria-label="Красная кнопка"></button>
                <button class="hack-pad is-green" type="button" data-pad="1" aria-label="Зеленая кнопка"></button>
                <button class="hack-pad is-blue" type="button" data-pad="2" aria-label="Синяя кнопка"></button>
                <button class="hack-pad is-yellow" type="button" data-pad="3" aria-label="Желтая кнопка"></button>
            </div>

            <div class="hack-dots" id="hackDots" aria-hidden="true"></div>

            <div class="hack-stage" aria-hidden="true">
                <div class="hack-machine" id="hackMachine">🥤</div>
                <div class="hack-door" id="hackDoor">🚪</div>
            </div>

            <button class="hack-next" type="button" id="hackNext" hidden>🚪 Пройти в новую комнату</button>
        </div>
    </div>

    <script src="common.js"></script>
    <script>
        (function () {
            'use strict';

            var O = window.Orakul;
            var Snd = O.Snd;
            var reduceMotion = O.reduceMotion;

            // Консоли — свой фон: загадочная мелодия и жужжание компьютера
            if (Snd.ambient) Snd.ambient('console');

            var out = document.getElementById('out');
            var outLive = document.getElementById('outLive');
            var liveReady = false;   // до конца загрузки не засоряем озвучку
            var term = document.getElementById('term');
            var form = document.getElementById('form');
            var input = document.getElementById('cmd');
            var statusEl = document.getElementById('termStatus');
            var accessEl = document.getElementById('accessLevel');
            var promptEl = document.getElementById('prompt');
            var stageEl = document.getElementById('stage');
            var stageRow = document.getElementById('stageRow');
            var phoneEl = document.getElementById('phone');
            var phoneBody = document.getElementById('phoneBody');
            var phoneLayer = document.getElementById('phoneLayer');
            var phoneCol = document.getElementById('phoneCol');
            var phoneUnder = document.getElementById('phoneUnder');
            var subtitleEl = document.getElementById('subtitle');
            var phoneClock = document.getElementById('phoneClock');

            var roomDoor = document.getElementById('roomDoor');
            var roomLook = document.getElementById('roomLook');
            var roomCooler = document.getElementById('roomCooler');
            var roomSnacks = document.getElementById('roomSnacks');
            var roomNext = document.getElementById('roomNext');

            var hackModal = document.getElementById('hackModal');
            var hackStatus = document.getElementById('hackStatus');
            var hackPads = document.getElementById('hackPads');
            var hackDotsEl = document.getElementById('hackDots');
            var hackMachine = document.getElementById('hackMachine');
            var hackDoor = document.getElementById('hackDoor');
            var hackNext = document.getElementById('hackNext');

            /* ================= ПЕЧАТНАЯ МАШИНКА ================= */
            var queue = [];
            var typing = false;
            var gen = 0;   // растёт при clear/reset: старый цикл печати умирает

            function scrollDown() { out.scrollTop = out.scrollHeight; }

            function announce(text) {
                if (!liveReady || !outLive || !text) return;
                outLive.textContent = text;
            }

            function stripTags(html) {
                var tmp = document.createElement('div');
                tmp.innerHTML = html;
                return tmp.textContent || '';
            }

            function pump() {
                if (typing) return;
                var job = queue.shift();
                if (!job) return;

                typing = true;
                var myGen = gen;

                var div = document.createElement('div');
                div.className = 'line ' + (job.cls || '');
                out.appendChild(div);
                scrollDown();

                // Реплики в трубке — глухим низким «буп» (как у Санса)
                if (job.cls && job.cls.indexOf('line-dialog') !== -1 && Snd.boss) Snd.boss();

                if (job.instant || reduceMotion || !job.text) {
                    if (job.html) div.innerHTML = job.html;
                    else div.textContent = job.text;
                    announce(job.html ? stripTags(job.html) : job.text);
                    typing = false;
                    scrollDown();
                    pump();
                    return;
                }

                var i = 0;
                var speed = job.fast ? 4 : 9;

                (function step() {
                    if (myGen !== gen) return;   // экран очистили — выходим
                    if (i >= job.text.length) {
                        if (job.html) div.innerHTML = job.html;
                        announce(job.html ? stripTags(job.html) : job.text);
                        typing = false;
                        scrollDown();
                        pump();
                        return;
                    }
                    var chunk = job.text.charAt(i);
                    if (Math.random() < 0.45 && i + 1 < job.text.length) chunk += job.text.charAt(i + 1);
                    div.textContent += chunk;
                    i += chunk.length;
                    if (i % 4 === 0) Snd.type();
                    scrollDown();
                    setTimeout(step, speed + Math.random() * 7);
                })();
            }

            function line(text, cls, opts) {
                queue.push({
                    text: String(text),
                    cls: cls || '',
                    instant: !!(opts && opts.instant),
                    fast: !!(opts && opts.fast)
                });
                pump();
            }

            function lineHTML(html, cls, opts) {
                queue.push({
                    text: stripTags(html),
                    html: html,
                    cls: cls || '',
                    instant: !!(opts && opts.instant),
                    fast: !!(opts && opts.fast)
                });
                pump();
            }

            function echo(cmd) {
                var div = document.createElement('div');
                div.className = 'line line-echo';
                div.setAttribute('data-prompt', admin ? 'admin@orakul:~$ ' : 'orakul@demo:~$ ');
                div.textContent = cmd;
                out.appendChild(div);
                scrollDown();
            }

            function flashTerm() {
                term.classList.remove('is-flash');
                void term.offsetWidth;
                term.classList.add('is-flash');
            }

            /* ================= МЫСЛИ ГЕРОЯ ================= */
            /* Субтитры внизу экрана. once — реплика звучит один раз за сеанс. */
            var subTimer = null;
            var thinkBeepTimer = null;
            var said = {};

            function escapeText(s) {
                var d = document.createElement('div');
                d.textContent = s;
                return d.innerHTML;
            }

            function think(text, once) {
                if (!subtitleEl || !text) return;
                if (once) {
                    if (said[text]) return;
                    said[text] = true;
                }

                subtitleEl.innerHTML = '<span class="th-who">Вы:</span> ' + escapeText(text);
                subtitleEl.classList.add('is-in');

                if (subTimer) clearTimeout(subTimer);
                subTimer = setTimeout(function () {
                    subtitleEl.classList.remove('is-in');
                }, 5200);

                // Посимвольный высокий писк мыслей (как в Deltarune)
                if (Snd.think) {
                    if (thinkBeepTimer) clearInterval(thinkBeepTimer);

                    var bi = 0;
                    thinkBeepTimer = setInterval(function () {
                        if (bi >= text.length) {
                            clearInterval(thinkBeepTimer);
                            thinkBeepTimer = null;
                            return;
                        }
                        bi += 2;
                        Snd.think();
                    }, 55);
                }
            }

            /* ================= КОМНАТА: ОСМОТР, КУЛЕР, АВТОМАТ ================= */
            /* Комната живёт отдельно от телефона: своё состояние, свой ключ
               в localStorage. Переживает перезагрузку, стирается на reset. */
            var room = (function () {
                var s = O.store.get('room.state', null);
                if (!s || typeof s !== 'object' || Array.isArray(s)) {
                    return { looked: false, slot: false, hacked: false };
                }
                return { looked: !!s.looked, slot: !!s.slot, hacked: !!s.hacked };
            })();

            /* Аноним уже писал? Флаг живёт здесь, чтобы его видели и комната,
               и телефон (раньше он был внутри модуля телефона). */
            var anonStarted = false;

            function saveRoom() {
                O.store.set('room.state', {
                    looked: room.looked,
                    slot: room.slot,
                    hacked: room.hacked
                });
            }

            /* Кнопки комнаты появляются по мере осмотра */
            function syncRoom() {
                // «Осмотреться» — только после того, как аноним написал в мессенджер
                if (roomLook) roomLook.hidden = !room.looked && !anonStarted;
                if (roomCooler) roomCooler.hidden = !room.looked;
                if (roomSnacks) roomSnacks.hidden = !room.looked;
                if (roomNext) roomNext.hidden = !room.hacked;
            }

            /* Облачный сюжет пришёл — перечитываем комнату */
            function reloadRoom() {
                var s = O.store.get('room.state', null);
                if (!s || typeof s !== 'object' || Array.isArray(s)) s = {};
                room.looked = !!s.looked;
                room.slot = !!s.slot;
                room.hacked = !!s.hacked;
                syncRoom();
            }

            function roomLookAround() {
                think('маленькое помещение, окон нет. В углу кулер и автомат со снеками. ' +
                      'В комнате беспорядок.');

                if (room.looked) return;
                room.looked = true;
                saveRoom();
                syncRoom();

                setTimeout(function () {
                    think('кулер и автомат. можно воды попить и снеки проверить.');
                }, 5600);
            }

            function roomCoolerDrink() {
                Snd.beep(420, 0.02, 0.1);
                think('вода холодная, мозги проясняются.');
            }

            /* Снеки: за автоматом щель, в ней — что-то скачиваемое */
            function roomCheckSnacks() {
                if (room.hacked) {
                    think('автомат уже отодвинут. больше он мне не нужен.');
                    return;
                }

                if (room.slot) {
                    think('щель за автоматом. там что-то есть.');
                    return;
                }

                room.slot = true;
                saveRoom();
                syncRoom();
                Snd.beep(360, 0.02, 0.08);

                think('за автоматом щель... тут что-то есть.', true);

                setTimeout(function () {
                    think('Возможно, какое-то приложение поможет взломать автомат.');
                }, 5600);
            }

            function roomGoNext() {
                line('> Дверь ведёт в темноту. Пока туда не пройти.', 'line-dialog');
                think('дверь ведёт в темноту. Пока туда не пройти.');
                Snd.beep(180, 0.03, 0.16);
            }

            /* ================= MINI-ИГРА «EasyHacking» ================= */
            /* «Саймон» на три уровня: длина последовательности растёт 3 → 4 → 5.
               Ошибка — повтор текущего уровня, все три пройдены — автомат отъезжает. */
            var HACK_PITCH = [392, 523, 659, 784];
            var HACK_LEVELS = [3, 4, 5];
            var hack = { seq: [], pos: 0, busy: true, run: 0, done: false, level: 0 };

            function hackStatusText(text, cls) {
                if (!hackStatus) return;
                hackStatus.textContent = text;
                hackStatus.className = 'hack-status' + (cls ? ' ' + cls : '');
            }

            function hackDots(n) {
                if (!hackDotsEl) return;
                var html = '';
                for (var i = 0; i < hack.seq.length; i++) {
                    html += '<i' + (i < n ? ' class="is-on"' : '') + '></i>';
                }
                hackDotsEl.innerHTML = html;
            }

            function hackLight(idx) {
                var pad = hackPads && hackPads.querySelector('[data-pad="' + idx + '"]');
                if (!pad) return;
                pad.classList.add('is-lit');
                Snd.blip(HACK_PITCH[idx] || 440, 0.18, 0.07);
                setTimeout(function () { pad.classList.remove('is-lit'); }, 230);
            }

            function hackRound() {
                var run = ++hack.run;

                hack.pos = 0;
                hack.busy = true;
                hack.done = false;

                // длина последовательности зависит от уровня
                var len = HACK_LEVELS[hack.level] || HACK_LEVELS[HACK_LEVELS.length - 1];
                hack.seq = [];
                for (var i = 0; i < len; i++) {
                    hack.seq.push(Math.floor(Math.random() * 4));
                }

                hackStatusText('уровень ' + (hack.level + 1) + ' из ' + HACK_LEVELS.length +
                               ' — запоминай последовательность');
                hackDots(0);

                var step = 0;
                setTimeout(function play() {
                    if (run !== hack.run) return;

                    if (step >= hack.seq.length) {
                        hack.busy = false;
                        hackStatusText('повтори');
                        return;
                    }

                    hackLight(hack.seq[step++]);
                    setTimeout(play, 520);
                }, 700);
            }

            function hackFail() {
                var run = hack.run;
                hack.busy = true;
                hackStatusText('Попробуй еще раз', 'is-bad');
                Snd.beep(140, 0.05, 0.3);

                setTimeout(function () {
                    if (run !== hack.run) return;
                    hackRound();   // тот же уровень заново
                }, 1500);
            }

            /* Уровень пройден: короткая пауза и следующий, более длинный */
            function hackLevelDone() {
                var run = ++hack.run;
                hack.busy = true;
                hackStatusText('уровень ' + (hack.level + 1) + ' пройден', 'is-ok');
                Snd.blip(659, 0.16, 0.06);
                setTimeout(function () { Snd.blip(880, 0.18, 0.06); }, 110);

                setTimeout(function () {
                    if (run !== hack.run) return;
                    hack.level++;
                    hackRound();
                }, 1400);
            }

            function hackSuccess() {
                hack.busy = true;
                hack.done = true;
                hackStatusText('взлом успешен', 'is-ok');

                if (hackMachine) hackMachine.classList.add('is-moved');
                if (hackDoor) hackDoor.classList.add('is-open');
                if (hackNext) hackNext.hidden = false;

                [523, 659, 784, 1046].forEach(function (f, i) {
                    setTimeout(function () { Snd.blip(f, 0.2, 0.06); }, i * 130);
                });

                room.hacked = true;
                saveRoom();
                syncRoom();
                grant('hack');
                think('готово. автомат отъехал.', true);
                line('> Взлом успешен. Автомат отодвинут.', 'line-ok');
            }

            function hackPad(idx) {
                if (hack.busy || hack.done) return;

                hackLight(idx);

                if (hack.seq[hack.pos] !== idx) {
                    hackFail();
                    return;
                }

                hack.pos++;
                hackDots(hack.pos);

                if (hack.pos >= hack.seq.length) {
                    if (hack.level < HACK_LEVELS.length - 1) hackLevelDone();
                    else hackSuccess();
                }
            }

            function openHack() {
                if (!hackModal) return;

                hackModal.hidden = false;
                document.body.classList.add('is-hack');

                if (hackMachine) hackMachine.classList.remove('is-moved');
                if (hackDoor) hackDoor.classList.remove('is-open');
                if (hackNext) hackNext.hidden = true;

                if (room.hacked) {
                    // уже взломано: показываем финальное состояние
                    hack.run++;
                    hack.busy = true;
                    hack.done = true;
                    hack.seq = [];
                    hackDots(0);
                    hackStatusText('автомат уже отодвинут', 'is-ok');
                    if (hackMachine) hackMachine.classList.add('is-moved');
                    if (hackDoor) hackDoor.classList.add('is-open');
                    if (hackNext) hackNext.hidden = false;
                } else {
                    hack.level = 0;   // всегда с первого уровня
                    hack.busy = true;
                    hack.done = false;
                    hack.seq = [];
                    hackDots(0);
                    hackStatusText('установка…');
                    setTimeout(function () {
                        if (hackModal.hidden) return;
                        hackRound();
                    }, 900);
                }

                Snd.beep(560, 0.03, 0.1);
            }

            function closeHack() {
                if (!hackModal || hackModal.hidden) return;
                hack.run++;   // обрываем идущую последовательность
                hackModal.hidden = true;
                document.body.classList.remove('is-hack');
                Snd.beep(300, 0.02, 0.08);
            }

            function resetRoom(persist) {
                room.looked = false;
                room.slot = false;
                room.hacked = false;
                anonStarted = false;
                /* При сбросе сюжета ключ room.state уже удалён — не пишем
                   его обратно пустым объектом. */
                if (persist !== false) saveRoom();
                syncRoom();
                closeHack();
            }

            /* Кнопки комнаты: дверь, осмотр, кулер, снеки */
            (function bindRoom() {
                if (roomDoor) {
                    roomDoor.addEventListener('click', function () {
                        think('закрыто каким-то кодовым замком... как я вообще здесь оказался?');
                    });
                }
                if (roomLook) roomLook.addEventListener('click', roomLookAround);
                if (roomCooler) roomCooler.addEventListener('click', roomCoolerDrink);
                if (roomSnacks) roomSnacks.addEventListener('click', roomCheckSnacks);
                if (roomNext) roomNext.addEventListener('click', roomGoNext);
                syncRoom();
            })();

            /* Мини-игра: кнопки, закрытие, Escape */
            (function bindHack() {
                if (!hackModal) return;

                if (hackPads) {
                    hackPads.addEventListener('click', function (e) {
                        var pad = e.target.closest && e.target.closest('[data-pad]');
                        if (!pad) return;
                        hackPad(parseInt(pad.getAttribute('data-pad'), 10) || 0);
                    });
                }

                hackModal.addEventListener('click', function (e) {
                    if (e.target === hackModal) closeHack();
                });

                var closeBtn = document.getElementById('hackClose');
                if (closeBtn) closeBtn.addEventListener('click', closeHack);

                if (hackNext) {
                    hackNext.addEventListener('click', function () {
                        closeHack();
                        roomGoNext();
                    });
                }

                document.addEventListener('keydown', function (e) {
                    if (e.key === 'Escape' && !hackModal.hidden) closeHack();
                });
            })();

            function setStatus(text, broken) {
                if (!statusEl) return;
                statusEl.textContent = text;
                statusEl.classList.toggle('is-broken', !!broken);
            }

            /* Очистка экрана. gen++ обрывает уже идущий цикл печати: иначе
               старый цикл продолжал дописывать строки, а новый параллельно
               забирал задачи из очереди — строки дублировались. */
            function clearScreen() {
                gen++;
                out.innerHTML = '';
                unknown.state = 'idle';
                boss.state = 'idle';
                connecting = false;
                queue.length = 0;
                typing = false;
                optsBlock = null;
                autoBusy = false;
                setStatus('secure', false);
            }

            function normalize(raw) {
                return String(raw || '')
                    .toLowerCase()
                    .replace(/[«»"'`]/g, '')
                    .replace(/[?!.,:;]/g, ' ')
                    .replace(/\s+/g, ' ')
                    .trim();
            }

            /* ================= ДОСТУП И СЮЖЕТ ================= */
            var admin = false;

            /* Был ли диалог с Неизвестным (45). Отдельный флаг не держим:
               источник правды — ачивка «Что это было?», она лежит в
               localStorage (common.js), поэтому знание про 45 переживает
               перезагрузку страницы. */
            function hasHeard45() { return O.has('whatwasthat'); }

            // Прогресс сюжета и доступ живут в localStorage и переживают
            // перезагрузку. clear/reset чистят только сюжет; полный сброс
            // (награды, мана, доступ) — кнопка на странице достижений.
            var KEY = {
                call: 'boss.call',
                choice: 'boss.choice',
                asked: 'boss.asked45',
                admin: 'admin',
                stats: 'orakul.global_stats',
                phone: 'phone.state'
            };

            function readPlot() {
                var choice = O.store.get(KEY.choice, null);
                return {
                    called: O.store.get(KEY.call, false) === true,
                    choice: (choice === 'fired' || choice === 'help') ? choice : null,
                    asked: O.store.get(KEY.asked, false) === true
                };
            }

            var plot = readPlot();

            /* ---- статистика: общая (localStorage) и за сеанс ---- */
            var STAT_FIELDS = ['boss_calls', 'fired', 'agent_7031'];

            var global_stats = O.store.get(KEY.stats, null);
            if (!global_stats || typeof global_stats !== 'object' || Array.isArray(global_stats)) {
                global_stats = {};
            }
            STAT_FIELDS.forEach(function (key) {
                if (typeof global_stats[key] !== 'number' || !isFinite(global_stats[key])) {
                    global_stats[key] = 0;
                }
            });

            var session_stats = { boss_calls: 0, fired: 0, agent_7031: 0 };

            function bumpStat(key) {
                global_stats[key] += 1;
                session_stats[key] += 1;
                O.store.set(KEY.stats, global_stats);
            }

            // видны из консоли браузера — удобно проверять
            window.global_stats = global_stats;
            window.session_stats = session_stats;

            function setAccess(isAdmin) {
                admin = !!isAdmin;
                if (accessEl) {
                    accessEl.textContent = isAdmin ? 'admin' : 'guest';
                    accessEl.classList.toggle('is-admin', isAdmin);
                }
                if (promptEl) {
                    promptEl.textContent = isAdmin ? 'admin@orakul:~$' : 'orakul@demo:~$';
                }
            }

            function doLogin(raw) {
                var parts = raw.trim().split(/\s+/);
                var loginName = (parts[1] || '').toLowerCase();
                var password = parts[2] || '';

                if (!loginName || !password) {
                    line('[ERROR] Формат: login <логин> <пароль>', 'line-err');
                    return;
                }

                if (loginName === 'admin' && password === 'QWERTY123') {
                    if (admin) {
                        line('> Вы уже вошли как admin.', 'line-ok');
                        return;
                    }
                    setAccess(true);
                    O.store.set(KEY.admin, true);
                    lineHTML('<span class="p">[ AUTH OK ]</span>', 'line-title');
                    line('добро пожаловать, admin', 'line-ok');
                    line('доступ: расширенный', 'line-dim');
                    lineHTML('новая команда: <span class="p">connect 9054</span>', 'granted');
                    Snd.beep(880, 0.03, 0.12);
                    setTimeout(function () { Snd.beep(1180, 0.03, 0.14); }, 130);
                    return;
                }

                line('[ERROR] Неверный логин или пароль. Доступ запрещен.', 'line-err');
                Snd.beep(150, 0.04, 0.22);
            }

            /* Выход: снимаем только доступ. Достижения, сюжет и
               статистика остаются на месте — в отличие от clear/reset. */
            function doLogout() {
                if (!admin) {
                    line('> Вы и так не в системе. Доступ: гость.', 'line-dim');
                    return;
                }

                // Выход не должен оставлять висящий диалог: если звонок
                // ждал ответа, он считается прерванным
                var dropped = false;
                if (boss.state === 'waiting') { boss.state = 'idle'; dropped = true; }
                if (unknown.state === 'waiting') { unknown.state = 'idle'; dropped = true; }
                if (dropped) lockOptions();

                setAccess(false);
                try { localStorage.removeItem(KEY.admin); } catch (e) {}
                line('> Вы вышли из системы. Доступ: гость.', 'line-ok');
                if (dropped) line('диалог прерван: сеанс завершён.', 'line-dim');
                Snd.beep(520, 0.03, 0.1);
                setTimeout(function () { Snd.beep(360, 0.03, 0.14); }, 130);
            }

            /* ================= ДОСТИЖЕНИЯ ================= */
            function grant(id) {
                var fresh = O.unlock(id);
                flashTerm();
                return fresh;
            }

            function grantHacker() {
                grant('hacker');
                setTimeout(function () {
                    lineHTML('<span class="p">[ ACCESS GRANTED ]</span>', 'line-title');
                    line('ядро: разблокировано', 'line-ok');
                    line('подпись: «Старый Кодер»', 'line-dim');
                    line('уровень доступа: полный', 'line-dim');
                    line('');
                    lineHTML('+ скрытая награда <span class="p">«Хакер»</span>', 'granted');
                    line('Полный список: achievements.html', 'line-dim');
                }, 260);
            }

            function grantOnePiece() {
                grant('onepiece');
                setTimeout(function () {
                    lineHTML('<span class="p">[ GRAND LINE FOUND ]</span>', 'line-title');
                    line('курс: проложен', 'line-ok');
                    line('команда: собрана', 'line-dim');
                    line('');
                    line('«Я стану королём пиратов!»', 'granted');
                    lineHTML('+ скрытая награда <span class="p">«Ван Пис»</span> 🏴‍☠️', 'granted');
                }, 260);
            }

            /* ================= МАТРИЦА ================= */
            /* Зелёный дождь на весь экран, через 2.6 с «глючит» и уводит
               на 404.html — будто система выбросила из сеанса. */
            var MATRIX_CHARS = 'アイウエオカキクケコサシスセソタチツテトナニヌネノ01ｱｲｳｴｵｶｷｸｹｺABCDEFXYZ#$%&*+=<>';

            function matrix() {
                if (document.getElementById('matrixRain')) return;

                var wrap = document.createElement('div');
                wrap.className = 'matrix-rain';
                wrap.id = 'matrixRain';
                wrap.setAttribute('aria-hidden', 'true');

                var cv = document.createElement('canvas');
                wrap.appendChild(cv);

                var hint = document.createElement('div');
                hint.className = 'matrix-hint';
                hint.textContent = 'пробуждение';
                wrap.appendChild(hint);

                document.body.appendChild(wrap);

                var ctx = cv.getContext('2d');
                var size = 16;
                var W = 0, H = 0, cols = 0, drops = [];

                function resize() {
                    W = cv.width = window.innerWidth;
                    H = cv.height = window.innerHeight;
                    cols = Math.ceil(W / size);
                    drops = [];
                    for (var i = 0; i < cols; i++) drops.push(Math.random() * -60);
                }

                resize();
                window.addEventListener('resize', resize);

                var raf = 0;
                var alive = true;

                function draw() {
                    if (!alive) return;

                    ctx.fillStyle = 'rgba(0, 0, 0, 0.08)';
                    ctx.fillRect(0, 0, W, H);

                    ctx.fillStyle = '#57ff9a';
                    ctx.font = size + 'px monospace';

                    for (var i = 0; i < cols; i++) {
                        var ch = MATRIX_CHARS.charAt(Math.floor(Math.random() * MATRIX_CHARS.length));
                        ctx.fillText(ch, i * size, drops[i] * size);
                        if (drops[i] * size > H && Math.random() > 0.975) drops[i] = 0;
                        drops[i]++;
                    }

                    raf = requestAnimationFrame(draw);
                }

                draw();

                if (Snd.staticNoise) Snd.staticNoise();

                setTimeout(function () {
                    wrap.classList.add('is-glitch');
                    document.body.classList.add('is-glitch');
                    if (Snd.creak) Snd.creak();
                }, 2600);

                setTimeout(function () {
                    alive = false;
                    cancelAnimationFrame(raf);
                    window.location.href = '404.html';
                }, 3300);
            }

            /* ================= ДИАЛОГ 1: НЕИЗВЕСТНЫЙ (3017) ================= */
            /* 30 — должность «Неизвестный», 17 — номер агента.
               Он набирает 45 (5045): мы сидим за его столом. */
            var unknown = { state: 'idle' };   // idle | waiting | blocked

            function startUnknown() {
                if (unknown.state === 'waiting') {
                    line('> 45 ждёт ответа: Да или Кто ты такой?', 'line-dialog');
                    return;
                }

                // После провала номер гаснет до конца сеанса. Сброс сюжета
                // (clear/reset или 0% рассудка) снова открывает 3017:
                // ачивка «Что это было?» при этом остаётся в профиле.
                if (unknown.state === 'blocked') {
                    line('> [ERROR] Номер 3017 отключён. Абонент недоступен.', 'line-err');
                    line('сброс: clear или reset', 'line-dim');
                    Snd.beep(140, 0.04, 0.18);
                    return;
                }

                unknown.state = 'waiting';
                setStatus('dialogue', true);
                Snd.beep(520, 0.02, 0.06);
                think('кто это? почему он говорит про 45?', true);

                // Та же анимация дозвона, что и у босса
                connectDots(function () {
                    line('> 45 (5045), Проект готов?', 'line-dialog');
                    line('');
                    Snd.beep(660, 0.025, 0.1);
                    options([
                        { text: 'Да' },
                        { text: 'Кто ты такой?' }
                    ]);
                });
            }

            function finishUnknown() {
                line('Соединение закрыто. Требуется сброс (clear или reset).', 'line-dim');
                unknown.state = 'blocked';
                setStatus('broken', true);
                Snd.beep(220, 0.03, 0.2);
                think('надо срочно позвонить боссу.', true);
            }

            function unknownAnswer(raw) {
                var answer = normalize(raw);
                lockOptions();

                if (/^(да|ага|yes|конечно|готов)/.test(answer)) {
                    line('> отлично, переходим к новой фазе', 'line-dialog');
                    line('');
                    grant('whatwasthat');
                    lineHTML('+ скрытая награда <span class="p">«Что это было?»</span> 👁️', 'granted');
                    finishUnknown();
                    return;
                }

                if (/кто\s*ты|кто\s*вы|who/.test(answer)) {
                    line('> у нас посторонний! закрыть доступ 45', 'line-dialog');
                    line('');
                    grant('whatwasthat');
                    lineHTML('+ скрытая награда <span class="p">«Что это было?»</span> 👁️', 'granted');
                    finishUnknown();
                    return;
                }

                line('> не понял. Ответь «Да» или «Кто ты такой?».', 'line-dialog');
                line('');
                Snd.beep(320, 0.02, 0.08);
                options([
                    { text: 'Да' },
                    { text: 'Кто ты такой?' }
                ]);
            }

            /* ================= ДИАЛОГ 2: БОСС ================= */
            var boss = { state: 'idle' };      // idle | waiting | blocked
            var connecting = false;            // идёт анимация «соединяем...»
            var optsBlock = null;              // блок с вариантами ответа
            var autoBusy = false;              // идёт автопечать выбранного варианта

            function connectDots(done) {
                connecting = true;

                var div = document.createElement('div');
                div.className = 'line line-dim';
                out.appendChild(div);

                var step = 1;
                div.textContent = 'соединяем.';
                scrollDown();

                var timer = setInterval(function () {
                    step++;
                    if (step > 3) {
                        clearInterval(timer);
                        div.textContent = 'соединяем... ok';
                        div.className = 'line line-ok';
                        scrollDown();
                        // Флаг снимаем вместе с запуском диалога, а не раньше:
                        // иначе 240 мс ввод проваливался в никуда
                        setTimeout(function () {
                            connecting = false;
                            done();
                        }, 240);
                        return;
                    }
                    div.textContent = 'соединяем' + new Array(step + 1).join('.');
                    scrollDown();
                    Snd.beep(480 + step * 120, 0.02, 0.05);
                }, 230);
            }

            /* Ждём, пока очередь печати допишет реплику, и только потом
               показываем варианты — иначе они выскакивают раньше вопроса */
            function whenIdle(fn) {
                var myGen = gen;
                (function wait() {
                    if (myGen !== gen) return;
                    if (!typing && !queue.length) { fn(); return; }
                    setTimeout(wait, 80);
                })();
            }

            /* Варианты ответа — кликабельные блоки прямо в логе */
            function options(list) {
                whenIdle(function () {
                    var wrap = document.createElement('div');
                    wrap.className = 'opts';

                    var label = document.createElement('div');
                    label.className = 'opts-label';
                    label.textContent = 'ответить (клик или ввод):';
                    wrap.appendChild(label);

                    list.forEach(function (item) {
                        var btn = document.createElement('button');
                        btn.type = 'button';
                        btn.className = 'opt' + (item.locked ? ' is-locked' : '');
                        btn.textContent = item.text;
                        btn.setAttribute('aria-label', item.locked ? item.text + ' — недоступно' : item.text);

                        btn.addEventListener('click', function (e) {
                            e.preventDefault();
                            e.stopPropagation();
                            pickOption(btn, item);
                        });

                        wrap.appendChild(btn);
                    });

                    out.appendChild(wrap);
                    optsBlock = wrap;
                    scrollDown();
                });
            }

            function lockOptions() {
                if (!optsBlock) return;
                Array.prototype.forEach.call(optsBlock.querySelectorAll('.opt'), function (btn) {
                    btn.classList.add('is-used');
                    btn.disabled = true;
                });
                optsBlock = null;
            }

            function pickOption(btn, item) {
                if (btn.disabled) return;

                if (item.locked) {
                    notAvailable();
                    return;   // диалог продолжается, блок остаётся на месте
                }

                lockOptions();
                Snd.orb(0.3);
                autoType(item.text);
            }

            /* Игрок как будто сам печатает выбранный вариант */
            function autoType(text) {
                if (autoBusy) return;
                if (reduceMotion) { run(text); return; }

                autoBusy = true;
                input.value = '';
                input.focus();
                var i = 0;

                (function step() {
                    i++;
                    input.value = text.slice(0, i);
                    if (i % 3 === 0) Snd.key();
                    if (i < text.length) {
                        setTimeout(step, 16);
                        return;
                    }
                    setTimeout(function () {
                        autoBusy = false;
                        input.value = '';
                        run(text);
                    }, 150);
                })();
            }

            /* Варианты ответа боссу (9054).
               «Я хочу помочь в поиске 45» виден всегда — и на первом звонке,
               и на повторном, — но открывается только после того, как босс
               рассказал про 45 (plot.asked). */
            function bossOptions() {
                var list = [];

                if (plot.called) {
                    list.push({ text: 'Ну а если серьезно, то когда? (зарплата)' });
                } else {
                    list.push({ text: 'Повысите мне зарплату' });
                    list.push({ text: 'Чем мы занимаемся?' });
                    if (hasHeard45()) {
                        list.push({ text: 'Что случилось с 45?' });
                    }
                }

                list.push({ text: 'Я хочу помочь в поиске 45', locked: !plot.asked });
                options(list);
            }

            function startBoss() {
                if (!admin) {
                    line('[ERROR] Недостаточно прав. Требуется вход в систему.', 'line-err');
                    line('подсказка: login <логин> <пароль>', 'line-dim');
                    Snd.beep(160, 0.04, 0.2);
                    return;
                }

                if (boss.state === 'waiting') {
                    line('> Босс ждёт ответа.', 'line-dialog');
                    return;
                }

                var repeat = plot.called;
                lockOptions();

                boss.state = 'waiting';
                setStatus('boss', true);
                Snd.beep(520, 0.02, 0.06);

                if (!plot.called) think('надеюсь, он в хорошем настроении...', true);

                connectDots(function () {
                    line(repeat ? '> Снова ты, говори быстрей.' : '> Злой Викторович, на связи. Говори быстрее.', 'line-dialog');
                    line('');
                    bossOptions();
                });
            }

            function notAvailable() {
                line('> Недоступно.', 'line-err');
                Snd.beep(150, 0.03, 0.16);
            }

            /* Конец звонка. kind:
                 'fired' / 'help' — босс бросил трубку и запустил телефон
                 null             — просто дисконект (первый звонок) */
            function endBossCall(kind) {
                line('');
                line('[СОЕДИНЕНИЕ РАЗОРВАНО]', 'line-err');
                boss.state = 'blocked';
                setStatus('broken', true);
                Snd.beep(120, 0.05, 0.3);

                plot.called = true;
                O.store.set(KEY.call, true);
                bumpStat('boss_calls');

                if (kind === 'fired' || kind === 'help') {
                    plot.choice = kind;
                    O.store.set(KEY.choice, kind);
                    bumpStat(kind === 'help' ? 'agent_7031' : 'fired');
                    // «Уволен» — сразу, «Оперативник» — через минуту в Phone
                    if (kind === 'fired') {
                        grant('fired');
                        think('вот блин. что теперь?', true);
                    }
                }

                // «На ковре у босса» — за состоявшийся разговор, а не за гудки
                grant('boss');

                if (kind === 'fired' || kind === 'help') Phone.start(kind);
            }

            function bossAnswer(raw) {
                var answer = normalize(raw);
                lockOptions();

                var about45 = /(^|\s)45(\s|$)/.test(answer) || /сорок\s*пять/.test(answer);

                // «Я хочу помочь в поиске 45»
                if (about45 && /(помочь|помощ|помогу)/.test(answer)) {
                    if (!plot.asked) {
                        notAvailable();
                        line('');
                        bossOptions();
                        return;
                    }
                    line('> Отлично! Сейчас тебе позвонит человек и даст инструкции.', 'line-dialog');
                    endBossCall('help');
                    return;
                }

                // «Что случилось с 45?» — возврат к вариантам
                if (about45) {
                    if (!hasHeard45()) {
                        line('> Не твоего ума дело. Спрашивай по существу.', 'line-dialog');
                        line('');
                        bossOptions();
                        return;
                    }
                    if (!plot.asked) {
                        plot.asked = true;
                        O.store.set(KEY.asked, true);
                    }
                    line('> Мне передали, что он сбежал. Мы уже ищем его. Что-то еще?', 'line-dialog');
                    line('');
                    bossOptions();
                    return;
                }

                // «Повысите мне зарплату» / «Ну а если серьезно, то когда?»
                if (/зарплат|повыс|преми|деньг|оклад|когда|серьезн/.test(answer)) {
                    if (!plot.called) {
                        line('> Уже 6-ой раз за день просят. Еще раз попросишь — уволю!', 'line-dialog');
                        endBossCall(null);
                        return;
                    }
                    line('> Все, ты доигрался. Жди звонок.', 'line-dialog');
                    endBossCall('fired');
                    return;
                }

                if (/занимаемся|делаем|чем\s+мы|работ|проект|задач/.test(answer)) {
                    line('> Ты сейчас серьезно? И этот человек программист...', 'line-dialog');
                    endBossCall(null);
                    return;
                }

                line('> Я не понял. Спроси по делу.', 'line-dialog');
                line('');
                bossOptions();
            }

            /* ================= ТЕЛЕФОН (сюжетный звонок) ================= */
            var PHONE_TEXT = {
                fired: 'Вы уволены. У вас есть 3 дня, чтобы забрать вещи из офиса.',
                help: 'Босс передал информацию о тебе. На твой телефон автоматически скачается нужное приложение. До связи, агент 7031.'
            };

            var Phone = (function () {
                var kind = 'fired';
                var accepted = false;

                var chatTyping = false;
                var mobileData = false;   // ползунок «Мобильные данные»
                var wifiMsg = '';
                var bright = 100;         // «Яркость» в настройках
                var logoClicks = 0;       // пять касаний по логотипу — секрет
                var notesOpen = false;    // панель «заметки 45»

                var browseResult = null;
                var searchNote = '';
                var downloadNote = '';
                var bossBlocked = false;  // игрок заблокирован в чате у босса

                var WIFI = ['Oracle_Net', 'Loop_Guest', 'Pizza_Free', 'Storm_5G'];
                var SEARCH = ['проект "оракул"', 'Злой Викторович', '5045 проект оракул'];
                var CHAT_NAMES = {
                    boss: 'Злой Викторович',
                    agent45: '5045',
                    pizza: 'Доставка пиццы',
                    anon: '???'
                };
                var PIZZA_ORDER = {
                    self: 'здравствуйте! можно мне пожалуйста пеперони на адрес: ул. Петли, 7, кв. 31',
                    boss: 'здравствуйте! можно мне пожалуйста пеперони на адрес: ул. Империя, 90, кв. 54'
                };

                /* Переписки. Босс — рабочие поручения 7031, пицца — прошлые
                   заказы на «странный» адрес, у 45 сообщений нет. */
                function freshChats() {
                    return {
                        boss: [
                            { who: 'them', text: '7031, отчёт по ночному фарму.' },
                            { who: 'me',   text: 'готово. 12 сундуков, 3 400 золота.' },

                            { who: 'me',   text: 'сделано.' },
